at choice for real-time transactional and analytical processing use cases such as caching, chat/messaging, gaming leaderboards, geospatial, machine learning, media streaming, queues, real-time analytics, and session store.</p>\n\n<p>Amazon ElastiCache for Redis Overview:\n<img src=\"https://d1.awsstatic.com/elasticache/EC_Use_Cases/product-page-diagram_ElastiCache_redis_how-it-works.eac60b60768c2a2041cc0b2673e7f5d2a0fef6a1.png\" style=\"display: none;\"><span class=\"ud-component--base-components--open-full-size-image\"><div class=\"open-full-size-image--wrapper--R4gIm\" data-purpose=\"open-full-size-image\"><img src=\"https://d1.awsstatic.com/elasticache/EC_Use_Cases/product-page-diagram_ElastiCache_redis_how-it-works.eac60b60768c2a2041cc0b2673e7f5d2a0fef6a1.png\" alt=\"\" loading=\"eager\"><button type=\"button\" class=\"ud-btn ud-btn-medium ud-btn-link ud-btn-text-sm open-full-size-image--backdrop--Zor3j\"><svg aria-label=\"Larger image\" role=\"img\" focusable=\"false\" class=\"ud-icon ud-icon-large ud-icon-color-neutral\"><use xlink:href=\"#icon-search\"></use></svg></button></div></span>\nvia - <a href=\"https://aws.amazon.com/elasticache/redis/\">https://aws.amazon.com/elasticache/redis/</a></p>\n\n<p>Although you can integrate Redis with DynamoDB, it's much more involved than using DAX which is a much better fit.</p>\n\n<p><strong>Enable Amazon DynamoDB Accelerator (DAX) for Amazon DynamoDB and ElastiCache Memcached for Amazon S3</strong></p>\n\n<p><strong>Enable ElastiCache Redis for DynamoDB and ElastiCache Memcached for Amazon S3</strong></p>\n\n<p>Amazon ElastiCache for Memcached is a Memcached-compatible in-memory key-value store service that can be used as a cache or a data store. Amazon ElastiCache for Memcached is a great choice for implementing an in-memory cache to decrease access latency, increase throughput, and ease the load off your relational or NoSQL database.</p>\n\n<p>Amazon ElastiCache Memcached cannot be used as a cache to serve static content from Amazon S3, so both these options are incorrect.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/dynamodb/dax/\">https://aws.amazon.com/dynamodb/dax/</a></p>\n\n<p><a href=\"https://aws.amazon.com/blogs/networking-and-content-delivery/amazon-s3-amazon-cloudfront-a-match-made-in-the-cloud/\">https://aws.amazon.com/blogs/networking-and-content-delivery/amazon-s3-amazon-cloudfront-a-match-made-in-the-cloud/</a></p>\n\n<p><a href=\"https://aws.amazon.com/elasticache/redis/\">https://aws.amazon.com/elasticache/redis/</a></p>\n"

// Hàm tự động phân tích nội dung giải thích để tìm ra đáp án đúng và sai
function parseQuestion(item) {
    let explanation = item.explanation;
    
    // Làm sạch HTML của ảnh (xóa thẻ bọc và nút bấm, chỉ giữ lại thẻ img)
    explanation = explanation.replace(/<span class="ud-component--base-components--open-full-size-image">[\s\S]*?<\/span>/g, '');
    explanation = explanation.replace(/style="display: none;"/g, 'style="display: block; max-width: 100%;"');

    let options = [];
    let correctIndices = [];

    // Lựa chọn là chữ in đậm <strong>…</strong>, hoặc khối code kẹp giữa hai đoạn "**" (câu 42).
    function leadOptions(text) {
        const found = [];
        const re = /<strong>(.*?)<\/strong>|<p>\*\*<\/p>\s*<pre><code>([\s\S]*?)<\/code><\/pre>/g;
        let m;
        while ((m = re.exec(text)) !== null) {
            found.push(m[1] !== undefined
                ? m[1].replace(/<.*?>/g, '').trim()
                : '<pre style="margin:0;white-space:pre-wrap;font-family:monospace">' + m[2].replace(/\s+$/, '') + '</pre>');
        }
        return found;
    }

    // Tìm các đáp án đúng (giữa "Correct option(s):" và mục kế tiếp). Không phân biệt hoa thường,
    // vì một số câu viết "Incorrect Options:" (câu 22, 55) và có mục "Exam Alert:" xen giữa (câu 55).
    let correctMatch = explanation.match(/<p>\s*Correct options?\s*:\s*<\/p>([\s\S]*?)(?=<p>\s*(?:Incorrect options?|References?|Exam Alert)\s*:\s*<\/p>|$)/i);
    if (correctMatch) {
        leadOptions(correctMatch[1]).forEach(cleanOpt => {
            if (!options.includes(cleanOpt)) {
                options.push(cleanOpt);
                correctIndices.push(options.length - 1);
            }
        });
    }

    // Tìm các đáp án sai (giữa "Incorrect option(s):" và "Reference(s):")
    let incorrectMatch = explanation.match(/<p>\s*Incorrect options?\s*:\s*<\/p>([\s\S]*?)(?=<p>\s*References?\s*:\s*<\/p>|$)/i);
    if (incorrectMatch) {
        leadOptions(incorrectMatch[1]).forEach(opt => {
            // Cắt bỏ phần giải thích thừa (nếu có dấu ' - ')
            const cleanOpt = opt.startsWith('<pre') ? opt : opt.split(' - ')[0].trim();
            if (!options.includes(cleanOpt)) {
                options.push(cleanOpt);
            }
        });
    }

    return {
        question: item.question,
        options: options,
        correctAnswerIndices: correctIndices,
        explanation: explanation
    };
}

// Xử lý toàn bộ dữ liệu thô thành dữ liệu chuẩn
const questionsData = rawData.map(parseQuestion);


// --- PHẦN LOGIC CỦA BÀI THI ---
let currentQuestionIndex = 0;
let score = 0;
let selectedOptions = [];
let isAnswered = false;

const questionTextEl = document.getElementById('question-text');
const optionsListEl = document.getElementById('options-list');
const explanationEl = document.getElementById('explanation');
const explanationTextEl = document.getElementById('explanation-text');
const checkBtn = document.getElementById('check-btn');
const nextBtn = document.getElementById('next-btn');
const progressEl = document.getElementById('progress');
const scoreEl = document.getElementById('score');
const quizScreen = document.getElementById('quiz-screen');
const resultScreen = document.getElementById('result-screen');
const multiSelectAlert = document.getElementById('multi-select-alert');

function loadQuestion() {
    isAnswered = false;
    selectedOptions = [];
    explanationEl.style.display = 'none';
    checkBtn.style.display = 'inline-block';
    checkBtn.disabled = true;
    nextBtn.style.display = 'none';

    const currentQ = questionsData[currentQuestionIndex];
    
    questionTextEl.innerHTML = currentQ.question;
    progressEl.textContent = `Câu ${currentQuestionIndex + 1} / ${questionsData.length}`;

    if (currentQ.correctAnswerIndices.length > 1) {
        multiSelectAlert.style.display = 'block';
    } else {
        multiSelectAlert.style.display = 'none';
    }

    optionsListEl.innerHTML = '';
    const letters = ['A', 'B', 'C', 'D', 'E', 'F'];

    currentQ.options.forEach((optionText, index) => {
        const li = document.createElement('li');
        li.className = 'option';
        li.innerHTML = `<span class="option-letter">${letters[index]}.</span><span class="option-text">${optionText}</span>`;
        li.onclick = () => selectOption(index, li);
        optionsListEl.appendChild(li);
    });
}

function selectOption(index, element) {
    if (isAnswered) return;

    const currentQ = questionsData[currentQuestionIndex];
    const isMulti = currentQ.correctAnswerIndices.length > 1;

    if (!isMulti) {
        document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
        selectedOptions = [index];
        element.classList.add('selected');
    } else {
        if (selectedOptions.includes(index)) {
            selectedOptions = selectedOptions.filter(i => i !== index);
            element.classList.remove('selected');
        } else {
            selectedOptions.push(index);
            element.classList.add('selected');
        }
    }
    checkBtn.disabled = selectedOptions.length === 0;
}

function checkAnswer() {
    if (selectedOptions.length === 0 || isAnswered) return;

    isAnswered = true;
    checkBtn.style.display = 'none';
    nextBtn.style.display = 'inline-block';

    const currentQ = questionsData[currentQuestionIndex];
    const allOptions = document.querySelectorAll('.option');
    allOptions.forEach(opt => opt.style.pointerEvents = 'none');

    let isCorrect = true;
    if (selectedOptions.length !== currentQ.correctAnswerIndices.length) {
        isCorrect = false;
    } else {
        for (let i = 0; i < selectedOptions.length; i++) {
            if (!currentQ.correctAnswerIndices.includes(selectedOptions[i])) {
                isCorrect = false;
                break;
            }
        }
    }

    currentQ.correctAnswerIndices.forEach(idx => {
        if (allOptions[idx]) allOptions[idx].classList.add('correct');
    });

    if (!isCorrect) {
        selectedOptions.forEach(idx => {
            if (!currentQ.correctAnswerIndices.includes(idx)) {
                if (allOptions[idx]) allOptions[idx].classList.add('incorrect');
            }
        });
    } else {
        score++;
        scoreEl.textContent = score;
    }

    explanationTextEl.innerHTML = currentQ.explanation;
    explanationEl.style.display = 'block';

    if (currentQuestionIndex === questionsData.length - 1) {
        nextBtn.textContent = 'Xem kết quả';
    }
}

function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < questionsData.length) {
        loadQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    quizScreen.style.display = 'none';
    resultScreen.style.display = 'block';
    document.getElementById('final-score').textContent = score;
    document.getElementById('total-q').textContent = questionsData.length;
    document.querySelector('.score-board').style.display = 'none';
}

if(questionsData.length > 0) {
    loadQuestion();
} else {
    document.getElementById('question-text').innerText = "Vui lòng dán dữ liệu JSON vào biến rawData trong code!";
}
</script>
<script>
/* Xáo thứ tự lựa chọn, giữ thứ tự câu hỏi (scripts/lib/external-html.ts). */
(function () {
  if (typeof questionsData === 'undefined' || typeof loadQuestion !== 'function') return;
  questionsData.forEach(function (q) {
    var idx = q.options.map(function (_, i) { return i; });
    for (var i = idx.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = idx[i]; idx[i] = idx[j]; idx[j] = t;
    }
    q.options = idx.map(function (i) { return q.options[i]; });
    q.correctAnswerIndices = q.correctAnswerIndices.map(function (c) { return idx.indexOf(c); });
  });
  if (questionsData.length > 0 && currentQuestionIndex === 0) loadQuestion();
})();
</script>
