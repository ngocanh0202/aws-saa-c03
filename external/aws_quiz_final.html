    "question": "<p>A biotechnology firm runs genomics data analysis workloads using AWS Lambda functions deployed inside a VPC in their central AWS account. The input data for these workloads consists of large files stored in an Amazon Elastic File System (Amazon EFS) that resides in a separate AWS account managed by a research partner. The firm wants the Lambda function in their account to access the shared EFS storage directly. The access pattern and file volume are expected to grow as additional research datasets are added over time, so the solution must be scalable and cost-efficient, and should require minimal operational overhead.</p>\n\n<p>Which solution best meets these requirements in the MOST cost-effective way?</p>",
    "options": [],
    "correctAnswerIndices": [],
    "explanation": "<p>Correct option:</p>\n\n<p><strong>Use Amazon EFS resource policies to allow cross-account access to the file system from the central account. Attach the EFS mount target to a shared VPC or peered VPC, and mount the file system in the Lambda function configuration using an EFS access point</strong></p>\n\n<p>This solution uses native AWS support for cross-account access to EFS via resource policies, combined with EFS access points and VPC-level networking (VPC peering or shared VPC). The Lambda function in the central account can mount the file system directly using the EFS mount target and access point as if it were in the same account. This method supports automatic scaling, secure access, and avoids any need for data duplication or proxy functions. It is the most cost-effective and operationally efficient solution.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Set up an Amazon S3 bucket in the research partner’s account and periodically copy EFS contents into the bucket using scheduled AWS DataSync jobs. Use Amazon S3 Access Points to expose the data to the Lambda function in the central account, allowing access via S3 API calls instead of file system mounts</strong> - While this approach enables cross-account access to data using Amazon S3 Access Points, it introduces significant storage duplication and recurring transfer costs. EFS contents must be periodically copied to S3 using AWS DataSync, which adds operational complexity and delay. This solution also does not support real-time or low-latency file system operations, which may be required by the workloads.</p>\n\n<p><strong>Create a second Lambda function in the research partner's account that mounts the EFS file system locally. Have the main Lambda function in the central account invoke this secondary Lambda via Amazon API Gateway for data access and computation. Use IAM cross-account permissions to allow invocation</strong> - This option introduces additional latency and architectural complexity by involving a proxy Lambda function in a separate account, which acts as an intermediary for file access. It breaks the direct file system access model, limits performance, and requires managing a custom API layer. It also increases operational overhead, and any scaling of the secondary function will incur further compute cost and complexity.</p>\n\n<p><strong>Package the genomic input data as a Lambda layer and publish it in the research partner's account. Share the layer across accounts by modifying its resource policy and attach the layer to the Lambda function in the central account to access the data during execution</strong> - Lambda layers are designed for shared code and dependencies, not for large or dynamic datasets like genomic files. There are strict size limits (250 MB unzipped) on Lambda layers, and they are immutable once published. Sharing large or growing data sets via Lambda layers is infeasible and not scalable. This method is both cost-ineffective and technically unsuitable for the given use case.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html\">https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html</a></p>\n\n<p><a href=\"https://repost.aws/questions/QUCxMGeJpWRKKuvibwxWfP7Q/cross-account-efs-access-point-mount-on-lambda-with-root-path-as\">https://repost.aws/questions/QUCxMGeJpWRKKuvibwxWfP7Q/cross-account-efs-access-point-mount-on-lambda-with-root-path-as</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/efs/latest/ug/efs-access-points.html\">https://docs.aws.amazon.com/efs/latest/ug/efs-access-points.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/datasync/latest/userguide/what-is-datasync.html\">https://docs.aws.amazon.com/datasync/latest/userguide/what-is-datasync.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/lambda/latest/dg/chapter-layers.html\">https://docs.aws.amazon.com/lambda/latest/dg/chapter-layers.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/lambda/latest/dg/adding-layers.html\">https://docs.aws.amazon.com/lambda/latest/dg/adding-layers.html</a></p>\n"
  },

    "question": "<p>A company uses Amazon S3 buckets for storing sensitive customer data. The company has defined different retention periods for different objects present in the Amazon S3 buckets, based on the compliance requirements. But, the retention rules do not seem to work as expected.</p>\n\n<p>Which of the following options represent a valid configuration for setting up retention periods for objects in Amazon S3 buckets? (Select two)</p>",
    "options": [],
    "correctAnswerIndices": [],
    "explanation": "<p>Correct options:</p>\n\n<p><strong>When you apply a retention period to an object version explicitly, you specify a <code>Retain Until Date</code> for the object version</strong></p>\n\n<p>You can place a retention period on an object version either explicitly or through a bucket default setting. When you apply a retention period to an object version explicitly, you specify a <code>Retain Until Date</code> for the object version. Amazon S3 stores the Retain Until Date setting in the object version's metadata and protects the object version until the retention period expires.</p>\n\n<p><strong>Different versions of a single object can have different retention modes and periods</strong></p>\n\n<p>Like all other Object Lock settings, retention periods apply to individual object versions. Different versions of a single object can have different retention modes and periods.</p>\n\n<p>For example, suppose that you have an object that is 15 days into a 30-day retention period, and you PUT an object into Amazon S3 with the same name and a 60-day retention period. In this case, your PUT succeeds, and Amazon S3 creates a new version of the object with a 60-day retention period. The older version maintains its original retention period and becomes deletable in 15 days.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>You cannot place a retention period on an object version through a bucket default setting</strong> - You can place a retention period on an object version either explicitly or through a bucket default setting.</p>\n\n<p><strong>When you use bucket default settings, you specify a <code>Retain Until Date</code> for the object version</strong> - When you use bucket default settings, you don't specify a Retain Until Date. Instead, you specify a duration, in either days or years, for which every object version placed in the bucket should be protected.</p>\n\n<p><strong>The bucket default settings will override any explicit retention mode or period you request on an object version</strong> - If your request to place an object version in a bucket contains an explicit retention mode and period, those settings override any bucket default settings for that object version.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/dev/object-lock-overview.html\">https://docs.aws.amazon.com/AmazonS3/latest/dev/object-lock-overview.html</a></p>\n"
  },
  {
    "question": "<p>A financial services company operates a containerized microservices architecture using Kubernetes in its on-premises data center. Due to strict industry regulations and internal security policies, all application data and workloads must remain physically within the on-premises environment. The company’s infrastructure team wants to modernize its Kubernetes stack and take advantage of AWS-managed services and APIs, including automated Kubernetes upgrades, Amazon CloudWatch integration, and access to AWS IAM features — but without migrating any data or compute resources to the cloud.</p>\n\n<p>Which AWS solution will best meet the company’s requirements for modernization while ensuring that all data remains on premises?</p>",
    "options": [],
    "correctAnswerIndices": [],
    "explanation": "<p>Correct option:</p>\n\n<p><strong>Install an AWS Outposts rack in the company’s data center. Use Amazon EKS Anywhere on Outposts to run containerized workloads locally while integrating with AWS APIs</strong></p>\n\n<p>This is the only option that allows the company to run Amazon EKS-compatible Kubernetes clusters entirely on premises while maintaining full data residency and regulatory compliance. AWS Outposts Rack brings native AWS services, including EKS, EC2, S3, and CloudWatch, into the customer’s local data center. mazon EKS Anywhere is a deployment option for Amazon Elastic Kubernetes Service (EKS) that allows you to create and manage Kubernetes clusters on your own infrastructure — such as on-premises servers or edge locations, outside of AWS. With EKS Anywhere running on Outposts, the company can modernize its Kubernetes stack with familiar AWS tooling without sending any data to the cloud.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q27-i1.jpg\" style=\"display: none;\"><span class=\"ud-component--base-components--open-full-size-image\"><div class=\"open-full-size-image--wrapper--R4gIm\" data-purpose=\"open-full-size-image\"><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q27-i1.jpg\" alt=\"\" loading=\"eager\"><button type=\"button\" class=\"ud-btn ud-btn-medium ud-btn-link ud-btn-text-sm open-full-size-image--backdrop--Zor3j\"><svg aria-label=\"Larger image\" role=\"img\" focusable=\"false\" class=\"ud-icon ud-icon-large ud-icon-color-neutral\"><use xlink:href=\"#icon-search\"></use></svg></button></div></span>\nvia - <a href=\"https://aws.amazon.com/blogs/containers/fully-private-local-clusters-for-amazon-eks-on-aws-outposts-powered-by-vpc-endpoints/\">https://aws.amazon.com/blogs/containers/fully-private-local-clusters-for-amazon-eks-on-aws-outposts-powered-by-vpc-endpoints/</a></p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q27-i2.jpg\" style=\"display: none;\"><span class=\"ud-component--base-components--open-full-size-image\"><div class=\"open-full-size-image--wrapper--R4gIm\" data-purpose=\"open-full-size-image\"><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q27-i2.jpg\" alt=\"\" loading=\"eager\"><button type=\"button\" class=\"ud-btn ud-btn-medium ud-btn-link ud-btn-text-sm open-full-size-image--backdrop--Zor3j\"><svg aria-label=\"Larger image\" role=\"img\" focusable=\"false\" class=\"ud-icon ud-icon-large ud-icon-color-neutral\"><use xlink:href=\"#icon-search\"></use></svg></button></div></span>\nvia - <a href=\"https://aws.amazon.com/blogs/containers/fully-private-local-clusters-for-amazon-eks-on-aws-outposts-powered-by-vpc-endpoints/\">https://aws.amazon.com/blogs/containers/fully-private-local-clusters-for-amazon-eks-on-aws-outposts-powered-by-vpc-endpoints/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Set up a dedicated AWS Direct Connect connection between the on-premises environment and an AWS Region. Deploy Amazon EKS in the cloud and connect it to the local Kubernetes cluster. Use IAM roles and API Gateway to integrate authentication and traffic flow for hybrid workloads</strong> -  Although AWS Direct Connect provides a private, low-latency connection between an on-prem data center and AWS, it does not meet data residency requirements, as workloads and data would still reside in the cloud. The use of Amazon EKS in the cloud violates the requirement to keep all workloads and data on premises. This hybrid model is suitable for low-sensitivity environments but not for compliance-restricted industries.</p>\n\n<p><strong>Deploy Amazon ECS with Fargate in a nearby AWS Local Zone. Use CloudWatch Logs to forward events to the primary region. Connect the Local Zone to the company’s data center over a VPN. Configure containers to pull data from on-premises storage through a mounted file share</strong> - AWS Local Zones are designed to place compute, storage, and select services closer to end-users in metro areas but still operate outside the customer’s data center and are managed by AWS. Using ECS in a Local Zone does not satisfy the strict requirement that all data remain physically in the company’s data center. Additionally, ECS is not Kubernetes-based, and it doesn’t support the same operational model as EKS.</p>\n\n<p><strong>Use an AWS Snowball Edge Compute Optimized device to run EKS-compatible Docker containers on-site. Periodically export application logs and container snapshots to Amazon S3 using Snowball’s offline data transfer features. Use the Snowball console to orchestrate workloads in batches</strong> - While Snowball Edge can run containerized applications using AWS IoT Greengrass or custom scripts, it is not intended for persistent production workloads or as a long-term infrastructure solution. Its primary use cases include offline data collection, edge processing, and bulk transfer to AWS. It lacks the scalability, lifecycle management, and Kubernetes support needed for this scenario.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/blogs/containers/fully-private-local-clusters-for-amazon-eks-on-aws-outposts-powered-by-vpc-endpoints/\">https://aws.amazon.com/blogs/containers/fully-private-local-clusters-for-amazon-eks-on-aws-outposts-powered-by-vpc-endpoints/</a></p>\n\n<p><a href=\"https://aws.amazon.com/eks/eks-anywhere/\">https://aws.amazon.com/eks/eks-anywhere/</a></p>\n\n<p><a href=\"https://aws.amazon.com/outposts/rack/\">https://aws.amazon.com/outposts/rack/</a></p>\n\n<p><a href=\"https://aws.amazon.com/about-aws/global-infrastructure/localzones/\">https://aws.amazon.com/about-aws/global-infrastructure/localzones/</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/snowball/latest/developer-guide/whatisedge.html\">https://docs.aws.amazon.com/snowball/latest/developer-guide/whatisedge.html</a></p>\n"
  },
  {
    "question": "<p>An IT consultant is helping the owner of a medium-sized business set up an AWS account. What are the security recommendations he must follow while creating the AWS account root user? (Select two)</p>",
    "options": [],
    "correctAnswerIndices": [],
    "explanation": "<p>Correct options:</p>\n\n<p><strong>Create a strong password for the AWS account root user</strong></p>\n\n<p><strong>Enable Multi Factor Authentication (MFA) for the AWS account root user account</strong></p>\n\n<p>Here are some of the best practices while creating an AWS account root user:</p>\n\n<p>1) Use a strong password to help protect account-level access to the AWS Management Console.\n2) Never share your AWS account root user password or access keys with anyone.\n3) If you do have an access key for your AWS account root user, delete it. If you must keep it, rotate (change) the access key regularly. You should not encrypt the access keys and save them on Amazon S3.\n4) If you don't already have an access key for your AWS account root user, don't create one unless you absolutely need to.\n5) Enable AWS multi-factor authentication (MFA) on your AWS account root user account.</p>\n\n<p>AWS Root Account Security Best Practices:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q31-i1.jpg\" style=\"display: none;\"><span class=\"ud-component--base-components--open-full-size-image\"><div class=\"open-full-size-image--wrapper--R4gIm\" data-purpose=\"open-full-size-image\"><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q31-i1.jpg\" alt=\"\" loading=\"eager\"><button type=\"button\" class=\"ud-btn ud-btn-medium ud-btn-link ud-btn-text-sm open-full-size-image--backdrop--Zor3j\"><svg aria-label=\"Larger image\" role=\"img\" focusable=\"false\" class=\"ud-icon ud-icon-large ud-icon-color-neutral\"><use xlink:href=\"#icon-search\"></use></svg></button></div></span>\nvia - <a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html\">https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Encrypt the access keys and save them on Amazon S3</strong> - AWS recommends that if you don't already have an access key for your AWS account root user, don't create one unless you absolutely need to. Even an encrypted access key for the root user poses a significant security risk. Therefore, this option is incorrect.</p>\n\n<p><strong>Create AWS account root user access keys and share those keys only with the business owner</strong> - AWS recommends that if you don't already have an access key for your AWS account root user, don't create one unless you absolutely need to. Hence, this option is incorrect.</p>\n\n<p><strong>Send an email to the business owner with details of the login username and password for the AWS root user. This will help the business owner to troubleshoot any login issues in future</strong> - AWS recommends that you should never share your AWS account root user password or access keys with anyone. Sending an email with AWS account root user credentials creates a security risk as it can be misused by anyone reading the email. Hence, this option is incorrect.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html#create-iam-users\">https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html#create-iam-users</a></p>\n"
  },
  {
    "question": "<p>A retail analytics company operates a large-scale data lake on Amazon S3, where they store daily logs of customer transactions, product views, and inventory updates. Each morning, they need to transform and load the data into a data warehouse to support fast analytical queries. The company also wants to enable data analysts to build and train machine learning (ML) models using familiar SQL syntax without writing custom Python code. The architecture must support massively parallel processing (MPP) for fast data aggregation and scoring, and must use serverless AWS services wherever possible to reduce infrastructure management and operational overhead.</p>\n\n<p>Which solution best meets these requirements?</p>",
    "options": [],
    "correctAnswerIndices": [],
    "explanation": "<p>Correct option:</p>\n\n<p><strong>Use a daily AWS Glue job to transform and clean the data stored in Amazon S3. Load the transformed dataset into Amazon Redshift Serverless, which offers MPP capabilities in a serverless model. Enable analysts to use Amazon Redshift ML to build and train ML models</strong></p>\n\n<p>This solution is fully serverless and optimized for high-performance analytics and ML. AWS Glue provides serverless ETL, and Amazon Redshift Serverless offers a MPP data warehouse that scales compute independently. Amazon Redshift ML lets analysts create, train, and deploy ML models using SQL by integrating with Amazon SageMaker under the hood — abstracting away the complexity of building models. This architecture meets all core requirements: serverless, SQL-based ML, and scalable MPP analytics.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q26-i1.jpg\" style=\"display: none;\"><span class=\"ud-component--base-components--open-full-size-image\"><div class=\"open-full-size-image--wrapper--R4gIm\" data-purpose=\"open-full-size-image\"><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q26-i1.jpg\" alt=\"\" loading=\"eager\"><button type=\"button\" class=\"ud-btn ud-btn-medium ud-btn-link ud-btn-text-sm open-full-size-image--backdrop--Zor3j\"><svg aria-label=\"Larger image\" role=\"img\" focusable=\"false\" class=\"ud-icon ud-icon-large ud-icon-color-neutral\"><use xlink:href=\"#icon-search\"></use></svg></button></div></span>\nvia - <a href=\"https://aws.amazon.com/blogs/big-data/create-train-and-deploy-machine-learning-models-in-amazon-redshift-using-sql-with-amazon-redshift-ml/\">https://aws.amazon.com/blogs/big-data/create-train-and-deploy-machine-learning-models-in-amazon-redshift-using-sql-with-amazon-redshift-ml/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Provision and run a daily Amazon EMR cluster with Apache Spark to process and transform the S3 data. Load the results into Amazon Redshift (provisioned). Enable ML model development by integrating Redshift with Amazon SageMaker notebooks for advanced modeling tasks</strong> - While EMR is suitable for large-scale transformation using Spark and Redshift supports MPP, this solution requires managing both EMR clusters and Redshift clusters. Additionally, ML modeling via SageMaker notebooks requires Python coding skills and breaks the requirement for SQL-based ML. This option introduces higher operational overhead and deviates from the serverless and SQL-only requirements.</p>\n\n<p><strong>Run a daily AWS Glue job to process and transform the raw files in S3 and register the outputs as Amazon Athena tables in AWS Glue Data Catalog. Allow analysts to build ML models using Amazon Athena ML, with SQL-based predictions on top of S3 data without moving it to a warehouse</strong> - Although AWS Glue offers serverless ETL and RDS for PostgreSQL is widely used, RDS is not a MPP data warehouse, and performance may not scale well for large, concurrent analytical queries. While Aurora ML allows calling SageMaker models from SQL, it’s designed for transactional workloads, not large-scale ML workflows. This approach doesn't align with the analytics and MPP scale required by the company.</p>\n\n<p><strong>Use an AWS Glue job to transform and load data into Amazon RDS for PostgreSQL. Allow analysts to run machine learning models using Amazon Aurora ML integrated with PostgreSQL, leveraging Amazon SageMaker endpoints behind the scenes</strong> - Using Amazon RDS for PostgreSQL does not meet the need for massively parallel processing or warehouse-scale analytics. RDS is optimized for transactional workloads rather than high-volume analytical processing, and it lacks the distributed query engine needed for fast aggregations across a large data lake. While database-to-ML integrations through SageMaker endpoints are technically possible, this architecture would not provide the performance characteristics or SQL-native ML workflow expected for large-scale retail analytics pipelines.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/blogs/big-data/create-train-and-deploy-machine-learning-models-in-amazon-redshift-using-sql-with-amazon-redshift-ml/\">https://aws.amazon.com/blogs/big-data/create-train-and-deploy-machine-learning-models-in-amazon-redshift-using-sql-with-amazon-redshift-ml/</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/serverless-whatis.html\">https://docs.aws.amazon.com/redshift/latest/mgmt/serverless-whatis.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/glue/latest/dg/what-is-glue.html\">https://docs.aws.amazon.com/glue/latest/dg/what-is-glue.html</a></p>\n\n<p><a href=\"https://github.com/awslabs/aws-athena-query-federation/wiki/AthenaML-Tutorial\">https://github.com/awslabs/aws-athena-query-federation/wiki/AthenaML-Tutorial</a></p>\n"
  },
  {
    "question": "<p>The engineering team at an in-home fitness company is evaluating multiple in-memory data stores with the ability to power its on-demand, live leaderboard. The company's leaderboard requires high availability, low latency, and real-time processing to deliver customizable user data for the community of users working out together virtually from the comfort of their home.</p>\n\n<p>As a solutions architect, which of the following solutions would you recommend? (Select two)</p>",
    "options": [],
    "correctAnswerIndices": [],
    "explanation": "<p>Correct options:</p>\n\n<p><strong>Power the on-demand, live leaderboard using Amazon ElastiCache for Redis as it meets the in-memory, high availability, low latency requirements</strong></p>\n\n<p>Amazon ElastiCache for Redis is a blazing fast in-memory data store that provides sub-millisecond latency to power internet-scale real-time applications. Amazon ElastiCache for Redis is a great choice for real-time transactional and analytical processing use cases such as caching, chat/messaging, gaming leaderboards, geospatial, machine learning, media streaming, queues, real-time analytics, and session store.\nElastiCache for Redis can be used to power the live leaderboard, so this option is correct.</p>\n\n<p>Amazon ElastiCache for Redis Overview:\n<img src=\"https://d1.awsstatic.com/elasticache/EC_Use_Cases/product-page-diagram_ElastiCache_redis_how-it-works.eac60b60768c2a2041cc0b2673e7f5d2a0fef6a1.png\" style=\"display: none;\"><span class=\"ud-component--base-components--open-full-size-image\"><div class=\"open-full-size-image--wrapper--R4gIm\" data-purpose=\"open-full-size-image\"><img src=\"https://d1.awsstatic.com/elasticache/EC_Use_Cases/product-page-diagram_ElastiCache_redis_how-it-works.eac60b60768c2a2041cc0b2673e7f5d2a0fef6a1.png\" alt=\"\" loading=\"eager\"><button type=\"button\" class=\"ud-btn ud-btn-medium ud-btn-link ud-btn-text-sm open-full-size-image--backdrop--Zor3j\"><svg aria-label=\"Larger image\" role=\"img\" focusable=\"false\" class=\"ud-icon ud-icon-large ud-icon-color-neutral\"><use xlink:href=\"#icon-search\"></use></svg></button></div></span></p>\n\n<p><strong>Power the on-demand, live leaderboard using Amazon DynamoDB with DynamoDB Accelerator (DAX) as it meets the in-memory, high availability, low latency requirements</strong></p>\n\n<p>Amazon DynamoDB is a key-value and document database that delivers single-digit millisecond performance at any scale. It's a fully managed, multiregion, multimaster, durable database with built-in security, backup and restore, and in-memory caching for internet-scale applications.\nDAX is a DynamoDB-compatible caching service that enables you to benefit from fast in-memory performance for demanding applications. So DynamoDB with DAX can be used to power the live leaderboard.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Power the on-demand, live leaderboard using Amazon Neptune as it meets the in-memory, high availability, low latency requirements</strong> - Amazon Neptune is a fast, reliable, fully-managed graph database service that makes it easy to build and run applications that work with highly connected datasets. Neptune is not an in-memory database, so this option is not correct.</p>\n\n<p><strong>Power the on-demand, live leaderboard using Amazon DynamoDB as it meets the in-memory, high availability, low latency requirements</strong> - DynamoDB is not an in-memory database, so this option is not correct.</p>\n\n<p><strong>Power the on-demand, live leaderboard using Amazon RDS for Aurora as it meets the in-memory, high availability, low latency requirements</strong> - Amazon Aurora is a MySQL and PostgreSQL-compatible relational database built for the cloud, that combines the performance and availability of traditional enterprise databases with the simplicity and cost-effectiveness of open source databases. Amazon Aurora features a distributed, fault-tolerant, self-healing storage system that auto-scales up to 128TB per database instance. Aurora is not an in-memory database, so this option is not correct.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/elasticache/\">https://aws.amazon.com/elasticache/</a></p>\n\n<p><a href=\"https://aws.amazon.com/elasticache/redis/\">https://aws.amazon.com/elasticache/redis/</a></p>\n\n<p><a href=\"https://aws.amazon.com/dynamodb/dax/\">https://aws.amazon.com/dynamodb/dax/</a></p>\n"
  },
  {
    "question": "<p>A gaming company is developing a mobile game that streams score updates to a backend processor and then publishes results on a leaderboard. The company has hired you as an AWS Certified Solutions Architect Associate to design a solution that can handle major traffic spikes, process the mobile game updates in the order of receipt, and store the processed updates in a highly available database. The company wants to minimize the management overhead required to maintain the solution.</p>\n\n<p>Which of the following will you recommend to meet these requirements?</p>",
    "options": [],
    "correctAnswerIndices": [],
    "explanation": "<p>Correct option:</p>\n\n<p><strong>Push score updates to Amazon Kinesis Data Streams which uses an AWS Lambda function to process these updates and then store these processed updates in Amazon DynamoDB</strong></p>\n\n<p>To help ingest real-time data or streaming data at large scales, you can use Amazon Kinesis Data Streams (KDS). KDS can continuously capture gigabytes of data per second from hundreds of thousands of sources. The data collected is available in milliseconds, enabling real-time analytics. KDS provides ordering of records, as well as the ability to read and/or replay records in the same order to multiple Amazon Kinesis Applications.</p>\n\n<p>AWS Lambda integrates natively with Kinesis Data Streams. The polling, checkpointing, and error handling complexities are abstracted when you use this native integration. The processed data can then be configured to be saved in Amazon DynamoDB.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Push score updates to an Amazon Simple Queue Service (Amazon SQS) queue which uses a fleet of Amazon EC2 instances (with Auto Scaling) to process these updates in the Amazon SQS queue and then store these processed updates in an Amazon RDS MySQL database</strong></p>\n\n<p><strong>Push score updates to Amazon Kinesis Data Streams which uses a fleet of Amazon EC2 instances (with Auto Scaling) to process the updates in Amazon Kinesis Data Streams and then store these processed updates in Amazon DynamoDB</strong></p>\n\n<p><strong>Push score updates to an Amazon Simple Notification Service (Amazon SNS) topic, subscribe an AWS Lambda function to this Amazon SNS topic to process the updates and then store these processed updates in a SQL database running on Amazon EC2 instance</strong></p>\n\n<p>These three options use Amazon EC2 instances as part of the solution architecture. The use-case seeks to minimize the management overhead required to maintain the solution. However, Amazon EC2 instances involve several maintenance activities such as managing the guest operating system and software deployed to the guest operating system, including updates and security patches, etc. Hence these options are incorrect.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://aws.amazon.com/blogs/big-data/best-practices-for-consuming-amazon-kinesis-data-streams-using-aws-lambda/\">https://aws.amazon.com/blogs/big-data/best-practices-for-consuming-amazon-kinesis-data-streams-using-aws-lambda/</a></p>\n"
  },

    "question": "<p>A healthcare company is developing a secure internal web portal hosted on AWS. The application must communicate with legacy systems that reside in the company's on-premises data centers. These data centers are connected to AWS via a site-to-site VPN. The company uses Amazon Route 53 as its DNS solution and requires the application to resolve private DNS records for the on-premises services from within its Amazon VPC.</p>\n\n<p>What is the MOST secure and appropriate way to meet these DNS resolution requirements?</p>",
    "options": [],
    "correctAnswerIndices": [],
    "explanation": "<p>Correct option:</p>\n\n<p><strong>Create a Route 53 Resolver outbound endpoint. Define a forwarding rule that routes DNS queries for on-premises domains to the on-premises DNS server. Associate the rule with the VPC</strong></p>\n\n<p>This solution allows DNS queries from AWS-based workloads (inside the VPC) to resolve private on-premises domain names using a Route 53 Resolver outbound endpoint. The outbound endpoint forwards DNS queries from the VPC to the on-premises DNS server across the site-to-site VPN. The forwarding rules determine which domain names are sent to the on-premises DNS server. Associating the rule with the correct VPC ensures that the application can securely resolve on-premises DNS records. This method follows AWS best practices for hybrid DNS resolution.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q63-i4.jpg\" style=\"display: none;\"><span class=\"ud-component--base-components--open-full-size-image\"><div class=\"open-full-size-image--wrapper--R4gIm\" data-purpose=\"open-full-size-image\"><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q63-i4.jpg\" alt=\"\" loading=\"eager\"><button type=\"button\" class=\"ud-btn ud-btn-medium ud-btn-link ud-btn-text-sm open-full-size-image--backdrop--Zor3j\"><svg aria-label=\"Larger image\" role=\"img\" focusable=\"false\" class=\"ud-icon ud-icon-large ud-icon-color-neutral\"><use xlink:href=\"#icon-search\"></use></svg></button></div></span>\nvia - <a href=\"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver.html\">https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Configure a Route 53 Resolver inbound endpoint and create a DNS forwarding rule. Enable recursive DNS resolution in the VPC to access on-premises services</strong> - An inbound endpoint allows DNS queries from the on-premises network to resolve AWS-hosted private domains, not the other way around. The application's requirement is to resolve on-premises DNS names from within AWS, which requires an outbound endpoint instead. Furthermore, there is no VPC configuration called “recursive DNS resolution” in this context. This option misapplies the purpose of inbound endpoints.</p>\n\n<p><strong>Create a hybrid connectivity gateway and attach the on-premises DNS servers to Route 53 as authoritative zones for internal domains</strong> - There is no such construct as a “hybrid connectivity gateway” in AWS that allows attaching DNS servers directly to Route 53. Route 53 does not support attaching on-premises DNS servers as authoritative sources. Instead, forwarding rules and Resolver endpoints are the proper mechanisms to integrate on-premises DNS resolution with AWS. This option misrepresents available AWS DNS and networking capabilities.</p>\n\n<p><strong>Create a Route 53 private hosted zone for the on-premises domain. Associate the hosted zone with the VPC to allow the application to resolve DNS names of the on-premises services</strong> - A Route 53 private hosted zone is designed to resolve DNS names within AWS resources for domains hosted on AWS, not for external or on-premises DNS domains. Creating a private hosted zone for an on-premises domain name does not enable resolution of actual on-premises DNS records unless those records are manually duplicated in Route 53, which would introduce operational overhead and potential inconsistency. The correct approach for hybrid DNS resolution is to use Route 53 Resolver outbound endpoints with forwarding rules that point to the on-premises DNS servers.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver.html\">https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/whitepapers/latest/hybrid-cloud-dns-options-for-vpc/route-53-resolver-endpoints-and-forwarding-rules.html\">https://docs.aws.amazon.com/whitepapers/latest/hybrid-cloud-dns-options-for-vpc/route-53-resolver-endpoints-and-forwarding-rules.html</a></p>\n"
  },
  {
    "question": "<p>The flagship application for a gaming company connects to an Amazon Aurora database and the entire technology stack is currently deployed in the United States. Now, the company has plans to expand to Europe and Asia for its operations. It needs the <code>games</code> table to be accessible globally but needs the <code>users</code> and <code>games_played</code> tables to be regional only.</p>\n\n<p>How would you implement this with minimal application refactoring?</p>",
    "options": [],
    "correctAnswerIndices": [],
    "explanation": "<p>Correct option:</p>\n\n<p><strong>Use an Amazon Aurora Global Database for the <code>games</code> table and use Amazon Aurora for the <code>users</code> and <code>games_played</code> tables</strong></p>\n\n<p>Amazon Aurora is a MySQL and PostgreSQL-compatible relational database built for the cloud, that combines the performance and availability of traditional enterprise databases with the simplicity and cost-effectiveness of open source databases. Amazon Aurora features a distributed, fault-tolerant, self-healing storage system that auto-scales up to 128TB per database instance. Aurora is not an in-memory database.</p>\n\n<p>Amazon Aurora Global Database is designed for globally distributed applications, allowing a single Amazon Aurora database to span multiple AWS regions. It replicates your data with no impact on database performance, enables fast local reads with low latency in each region, and provides disaster recovery from region-wide outages. Amazon Aurora Global Database is the correct choice for the given use-case.</p>\n\n<p>For the given use-case, we, therefore, need to have two Aurora clusters, one for the global table (games table) and the other one for the local tables (users and games_played tables).</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use an Amazon Aurora Global Database for the <code>games</code> table and use Amazon DynamoDB tables for the <code>users</code> and <code>games_played</code> tables</strong></p>\n\n<p><strong>Use a Amazon DynamoDB global table for the <code>games</code> table and use Amazon Aurora for the <code>users</code> and <code>games_played</code> tables</strong></p>\n\n<p><strong>Use a Amazon DynamoDB global table for the <code>games</code> table and use Amazon DynamoDB tables for the <code>users</code> and <code>games_played</code> tables</strong></p>\n\n<p>Here, we want minimal application refactoring. Amazon DynamoDB and Amazon Aurora have a completely different APIs, due to Amazon Aurora being SQL and Amazon DynamoDB being NoSQL. So all three options are incorrect, as they have Amazon DynamoDB as one of the components.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://aws.amazon.com/rds/aurora/faqs/\">https://aws.amazon.com/rds/aurora/faqs/</a></p>\n"
  },
  {
    "question": "<p>A new DevOps engineer has just joined a development team and wants to understand the replication capabilities for Amazon RDS Multi-AZ deployment as well as Amazon RDS Read-replicas.</p>\n\n<p>Which of the following correctly summarizes these capabilities for the given database?</p>",
    "options": [],
    "correctAnswerIndices": [],
    "explanation": "<p>Correct option:</p>\n\n<p><strong>Multi-AZ follows synchronous replication and spans at least two Availability Zones (AZs) within a single region. Read replicas follow asynchronous replication and can be within an Availability Zone (AZ), Cross-AZ, or Cross-Region</strong></p>\n\n<p>Amazon RDS Multi-AZ deployments provide enhanced availability and durability for RDS database (DB) instances, making them a natural fit for production database workloads. When you provision a Multi-AZ DB Instance, Amazon RDS automatically creates a primary DB Instance and synchronously replicates the data to a standby instance in a different Availability Zone (AZ). Multi-AZ spans at least two Availability Zones (AZs) within a single region.</p>\n\n<p>Amazon RDS Read Replicas provide enhanced performance and durability for RDS database (DB) instances. They make it easy to elastically scale out beyond the capacity constraints of a single DB instance for read-heavy database workloads. For the MySQL, MariaDB, PostgreSQL, Oracle, and SQL Server database engines, Amazon RDS creates a second DB instance using a snapshot of the source DB instance. It then uses the engines' native asynchronous replication to update the read replica whenever there is a change to the source DB instance.</p>\n\n<p>Amazon RDS replicates all databases in the source DB instance. Read replicas can be within an Availability Zone (AZ), Cross-AZ, or Cross-Region.</p>\n\n<p>Exam Alert:</p>\n\n<p>Please review this comparison vis-a-vis Multi-AZ vs Read Replica for Amazon RDS:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q52-i1.jpg\" style=\"display: none;\"><span class=\"ud-component--base-components--open-full-size-image\"><div class=\"open-full-size-image--wrapper--R4gIm\" data-purpose=\"open-full-size-image\"><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q52-i1.jpg\" alt=\"\" loading=\"eager\"><button type=\"button\" class=\"ud-btn ud-btn-medium ud-btn-link ud-btn-text-sm open-full-size-image--backdrop--Zor3j\"><svg aria-label=\"Larger image\" role=\"img\" focusable=\"false\" class=\"ud-icon ud-icon-large ud-icon-color-neutral\"><use xlink:href=\"#icon-search\"></use></svg></button></div></span>\nvia - <a href=\"https://aws.amazon.com/rds/features/multi-az/\">https://aws.amazon.com/rds/features/multi-az/</a></p>\n\n<p>Incorrect Options:</p>\n\n<p><strong>Multi-AZ follows asynchronous replication and spans one Availability Zone (AZ) within a single region. Read replicas follow synchronous replication and can be within an Availability Zone (AZ), Cross-AZ, or Cross-Region</strong></p>\n\n<p><strong>Multi-AZ follows asynchronous replication and spans at least two Availability Zones (AZs) within a single region. Read replicas follow synchronous replication and can be within an Availability Zone (AZ), Cross-AZ, or Cross-Region</strong></p>\n\n<p><strong>Multi-AZ follows asynchronous replication and spans at least two Availability Zones (AZs) within a single region. Read replicas follow asynchronous replication and can be within an Availability Zone (AZ), Cross-AZ, or Cross-Region</strong></p>\n\n<p>These three options contradict the earlier details provided in the explanation. To summarize, Multi-AZ deployment follows synchronous replication for Amazon RDS. Hence these options are incorrect.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/rds/features/multi-az/\">https://aws.amazon.com/rds/features/multi-az/</a></p>\n\n<p><a href=\"https://aws.amazon.com/rds/features/read-replicas/\">https://aws.amazon.com/rds/features/read-replicas/</a></p>\n"
  },
  {
    "question": "<p>A research group runs its flagship application on a fleet of Amazon EC2 instances for a specialized task that must deliver high random I/O performance. Each instance in the fleet would have access to a dataset that is replicated across the instances by the application itself. Because of the resilient application architecture, the specialized task would continue to be processed even if any instance goes down, as the underlying application would ensure the replacement instance has access to the required dataset.</p>\n\n<p>Which of the following options is the MOST cost-optimal and resource-efficient solution to build this fleet of Amazon EC2 instances?</p>",
    "options": [],
    "correctAnswerIndices": [],
    "explanation": "<p>Correct option:</p>\n\n<p><strong>Use Instance Store based Amazon EC2 instances</strong></p>\n\n<p>An instance store provides temporary block-level storage for your instance. This storage is located on disks that are physically attached to the host instance. Instance store is ideal for the temporary storage of information that changes frequently such as buffers, caches, scratch data, and other temporary content, or for data that is replicated across a fleet of instances, such as a load-balanced pool of web servers. Instance store volumes are included as part of the instance's usage cost.</p>\n\n<p>As Instance Store based volumes provide high random I/O performance at low cost (as the storage is part of the instance's usage cost) and the resilient architecture can adjust for the loss of any instance, therefore you should use Instance Store based Amazon EC2 instances for this use-case.</p>\n\n<p>Amazon EC2 Instance Store Overview:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q43-i1.jpg\" style=\"display: none;\"><span class=\"ud-component--base-components--open-full-size-image\"><div class=\"open-full-size-image--wrapper--R4gIm\" data-purpose=\"open-full-size-image\"><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q43-i1.jpg\" alt=\"\" loading=\"eager\"><button type=\"button\" class=\"ud-btn ud-btn-medium ud-btn-link ud-btn-text-sm open-full-size-image--backdrop--Zor3j\"><svg aria-label=\"Larger image\" role=\"img\" focusable=\"false\" class=\"ud-icon ud-icon-large ud-icon-color-neutral\"><use xlink:href=\"#icon-search\"></use></svg></button></div></span>\nvia - <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/InstanceStorage.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/InstanceStorage.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use Amazon Elastic Block Store (Amazon EBS) based EC2 instances</strong> - Amazon Elastic Block Store (Amazon EBS) based volumes would need to use provisioned IOPS (io1) as the storage type and that would incur additional costs. As we are looking for the most cost-optimal solution, this option is ruled out.</p>\n\n<p><strong>Use Amazon EC2 instances with Amazon EFS mount points</strong> - Using Amazon Elastic File System (Amazon EFS) implies that extra resources would have to be provisioned (compared to using instance store where the storage is located on disks that are physically attached to the host instance itself). As we are looking for the most resource-efficient solution, this option is also ruled out.</p>\n\n<p><strong>Use Amazon EC2 instances with access to Amazon S3 based storage</strong> - Using Amazon EC2 instances with access to Amazon S3 based storage does not deliver high random I/O performance, this option is just added as a distractor.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/InstanceStorage.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/InstanceStorage.html</a></p>\n"
  },
  {
    "question": "<p>A new DevOps engineer has joined a large financial services company recently. As part of his onboarding, the IT department is conducting a review of the checklist for tasks related to AWS Identity and Access Management (AWS IAM).</p>\n\n<p>As an AWS Certified Solutions Architect – Associate, which best practices would you recommend (Select two)?</p>",
    "options": [],
    "correctAnswerIndices": [],
    "explanation": "<p>Correct options:</p>\n\n<p><strong>Enable AWS Multi-Factor Authentication (AWS MFA) for privileged users</strong></p>\n\n<p>As per the AWS best practices, it is better to enable Multi Factor Authentication (MFA) for privileged users via an MFA-enabled mobile device or hardware MFA token.</p>\n\n<p><strong>Configure AWS CloudTrail to log all AWS Identity and Access Management (AWS IAM) actions</strong></p>\n\n<p>AWS recommends to turn on AWS CloudTrail to log all IAM actions for monitoring and audit purposes.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Create a minimum number of accounts and share these account credentials among employees</strong> - AWS recommends that user account credentials should not be shared between users. So, this option is incorrect.</p>\n\n<p><strong>Grant maximum privileges to avoid assigning privileges again</strong> - AWS recommends granting the least privileges required to complete a certain job and avoid giving excessive privileges which can be misused. So, this option is incorrect.</p>\n\n<p><strong>Use user credentials to provide access specific permissions for Amazon EC2 instances</strong> - It is highly recommended to use roles to grant access permissions for EC2 instances working on different AWS services. So, this option is incorrect.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/iam/\">https://aws.amazon.com/iam/</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html\">https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/cloudtrail/faqs/\">https://aws.amazon.com/cloudtrail/faqs/</a></p>\n"
  },
  {
    "question": "<p>A leading carmaker would like to build a new car-as-a-sensor service by leveraging fully serverless components that are provisioned and managed automatically by AWS. The development team at the carmaker does not want an option that requires the capacity to be manually provisioned, as it does not want to respond manually to changing volumes of sensor data.</p>\n\n<p>Given these constraints, which of the following solutions is the BEST fit to develop this car-as-a-sensor service?</p>",
    "options": [],
    "correctAnswerIndices": [],
    "explanation": "<p>Correct option:</p>\n\n<p><strong>Ingest the sensor data in an Amazon Simple Queue Service (Amazon SQS) standard queue, which is polled by an AWS Lambda function in batches and the data is written into an auto-scaled Amazon DynamoDB table for downstream processing</strong></p>\n\n<p>AWS Lambda lets you run code without provisioning or managing servers. You pay only for the compute time you consume. Amazon Simple Queue Service (SQS) is a fully managed message queuing service that enables you to decouple and scale microservices, distributed systems, and serverless applications. SQS offers two types of message queues. Standard queues offer maximum throughput, best-effort ordering, and at-least-once delivery. SQS FIFO queues are designed to guarantee that messages are processed exactly once, in the exact order that they are sent.</p>\n\n<p>AWS manages all ongoing operations and underlying infrastructure needed to provide a highly available and scalable message queuing service. With SQS, there is no upfront cost, no need to acquire, install, and configure messaging software, and no time-consuming build-out and maintenance of supporting infrastructure. SQS queues are dynamically created and scale automatically so you can build and grow applications quickly and efficiently.</p>\n\n<p>As there is no need to manually provision the capacity, so this is the correct option.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Ingest the sensor data in Amazon Kinesis Data Firehose, which directly writes the data into an auto-scaled Amazon DynamoDB table for downstream processing</strong> -Amazon Kinesis Data Firehose is a fully managed service for delivering real-time streaming data to destinations such as Amazon Simple Storage Service (Amazon S3), Amazon Redshift, Amazon OpenSearch Service, Splunk, and any custom HTTP endpoint or HTTP endpoints owned by supported third-party service providers, including Datadog, Dynatrace, LogicMonitor, MongoDB, New Relic, and Sumo Logic.</p>\n\n<p>Firehose cannot directly write into a DynamoDB table, so this option is incorrect.</p>\n\n<p><strong>Ingest the sensor data in an Amazon Simple Queue Service (Amazon SQS) standard queue, which is polled by an application running on an Amazon EC2 instance and the data is written into an auto-scaled Amazon DynamoDB table for downstream processing</strong></p>\n\n<p><strong>Ingest the sensor data in Amazon Kinesis Data Streams, which is polled by an application running on an Amazon EC2 instance and the data is written into an auto-scaled Amazon DynamoDB table for downstream processing</strong></p>\n\n<p>Using an application on an Amazon EC2 instance is ruled out as the carmaker wants to use fully serverless components. So both these options are incorrect.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/sqs/\">https://aws.amazon.com/sqs/</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/lambda/latest/dg/with-kinesis.html\">https://docs.aws.amazon.com/lambda/latest/dg/with-kinesis.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/lambda/latest/dg/with-sqs.html\">https://docs.aws.amazon.com/lambda/latest/dg/with-sqs.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/kinesis/data-streams/faqs/\">https://aws.amazon.com/kinesis/data-streams/faqs/</a></p>\n"
  },
  {
    "question": "<p>An e-commerce company manages a digital catalog of consumer products submitted by third-party sellers. Each product submission includes a description stored as a text file in an Amazon S3 bucket. These descriptions may include ingredient information for consumable products like snacks, supplements, or beverages. The company wants to build a fully automated solution that extracts ingredient names from the uploaded product descriptions and uses those names to query an Amazon DynamoDB table, which returns precomputed health and safety scores for each ingredient. Non-food items and invalid submissions can be ignored without affecting application logic. The company has no in-house machine learning (ML) experts and is looking for the most cost-effective solution with minimal operational overhead.</p>\n\n<p>Which solution meets these requirements MOST cost-effectively?</p>",
    "options": [],
    "correctAnswerIndices": [],
    "explanation": "<p>Correct option:</p>\n\n<p><strong>Configure S3 Event Notifications to trigger an AWS Lambda function whenever a new product description is uploaded. Inside the function, use Amazon Comprehend's custom entity recognition feature to extract ingredient names. Store these names in the DynamoDB table and let the front-end application query for health scores</strong></p>\n\n<p>This option uses Amazon Comprehend's custom entity recognition feature to detect and extract ingredients from unstructured text. Since Comprehend is fully managed and doesn't require ML expertise, it aligns with the company’s constraints. It integrates easily into a serverless pipeline using S3 Event Notifications and AWS Lambda. The ingredient names can then be used as lookup keys in a DynamoDB table to retrieve nutrition or safety scores. This architecture is event-driven, scalable, cost-efficient, and requires minimal operational effort.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q4-i1.jpg\" style=\"display: none;\"><span class=\"ud-component--base-components--open-full-size-image\"><div class=\"open-full-size-image--wrapper--R4gIm\" data-purpose=\"open-full-size-image\"><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q4-i1.jpg\" alt=\"\" loading=\"eager\"><button type=\"button\" class=\"ud-btn ud-btn-medium ud-btn-link ud-btn-text-sm open-full-size-image--backdrop--Zor3j\"><svg aria-label=\"Larger image\" role=\"img\" focusable=\"false\" class=\"ud-icon ud-icon-large ud-icon-color-neutral\"><use xlink:href=\"#icon-search\"></use></svg></button></div></span>\nvia - <a href=\"https://docs.aws.amazon.com/comprehend/latest/dg/what-is.html\">https://docs.aws.amazon.com/comprehend/latest/dg/what-is.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use Amazon SageMaker with a custom-trained NLP model to identify ingredients from the uploaded descriptions. Use Amazon EventBridge to invoke a Lambda function that forwards the document content to a SageMaker endpoint and stores the results in DynamoDB. Fine-tune the model using labeled ingredient datasets from open-source repositories and retrain it monthly</strong> - While SageMaker is a powerful and flexible ML service, it requires ML expertise to train, deploy, and manage models. Fine-tuning and maintaining a custom NLP model, especially for entity extraction, involves substantial effort and cost. It also contradicts the company’s requirement to avoid ML development overhead. This solution is over-engineered for the use case and not the most cost-effective.</p>\n\n<p><strong>Create a workflow where Amazon Transcribe is used to convert synthetic audio versions (created from text of the product descriptions) back into text. Analyze the transcripts manually or using simple keyword matching within a Lambda function. Use Amazon SNS to notify the content moderation team for each processed file</strong> - This approach is convoluted and inefficient. Generating synthetic audio from text, transcribing it back, and relying on manual or keyword-based analysis introduces redundant processing steps and delays. Additionally, using Amazon SNS to notify human reviewers increases operational burden and violates the requirement for a fully automated solution.</p>\n\n<p><strong>Use Amazon Lookout for Vision to scan the uploaded text files in the S3 bucket and extract entities. Invoke this workflow using an S3-triggered Lambda function. Parse the output and use Amazon API Gateway to push updates to the frontend in real time</strong> - Amazon Lookout for Vision is designed for image-based anomaly detection, not text processing. It cannot extract entities or analyze structured/unstructured text documents, making it completely unsuitable for this use case. Using API Gateway for pushing updates is unrelated to the core requirement of ingredient extraction and further increases complexity.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/comprehend/latest/dg/what-is.html\">https://docs.aws.amazon.com/comprehend/latest/dg/what-is.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/comprehend/latest/dg/custom-entity-recognition.html\">https://docs.aws.amazon.com/comprehend/latest/dg/custom-entity-recognition.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/blogs/machine-learning/build-a-custom-entity-recognizer-using-amazon-comprehend/\">https://aws.amazon.com/blogs/machine-learning/build-a-custom-entity-recognizer-using-amazon-comprehend/</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/whatis.html\">https://docs.aws.amazon.com/sagemaker/latest/dg/whatis.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/transcribe/latest/dg/what-is.html\">https://docs.aws.amazon.com/transcribe/latest/dg/what-is.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/lookout-for-vision/latest/developer-guide/what-is.html\">https://docs.aws.amazon.com/lookout-for-vision/latest/developer-guide/what-is.html</a></p>\n"
  },
  {
    "question": "<p>The engineering team at a data analytics company has observed that its flagship application functions at its peak performance when the underlying Amazon Elastic Compute Cloud (Amazon EC2) instances have a CPU utilization of about 50%. The application is built on a fleet of Amazon EC2 instances managed under an Auto Scaling group. The workflow requests are handled by an internal Application Load Balancer that routes the requests to the instances.</p>\n\n<p>As a solutions architect, what would you recommend so that the application runs near its peak performance state?</p>",
    "options": [],
    "correctAnswerIndices": [],
    "explanation": "<p>Correct option:</p>\n\n<p><strong>Configure the Auto Scaling group to use target tracking policy and set the CPU utilization as the target metric with a target value of 50%</strong></p>\n\n<p>An Auto Scaling group contains a collection of Amazon EC2 instances that are treated as a logical grouping for the purposes of automatic scaling and management. An Auto Scaling group also enables you to use Amazon EC2 Auto Scaling features such as health check replacements and scaling policies.</p>\n\n<p>With target tracking scaling policies, you select a scaling metric and set a target value. Amazon EC2 Auto Scaling creates and manages the CloudWatch alarms that trigger the scaling policy and calculates the scaling adjustment based on the metric and the target value. The scaling policy adds or removes capacity as required to keep the metric at, or close to, the specified target value.</p>\n\n<p>For example, you can use target tracking scaling to:</p>\n\n<p>Configure a target tracking scaling policy to keep the average aggregate CPU utilization of your Auto Scaling group at 50 percent. This meets the requirements specified in the given use-case and therefore, this is the correct option.</p>\n\n<p>Target Tracking Policy Overview:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q30-i1.jpg\" style=\"display: none;\"><span class=\"ud-component--base-components--open-full-size-image\"><div class=\"open-full-size-image--wrapper--R4gIm\" data-purpose=\"open-full-size-image\"><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q30-i1.jpg\" alt=\"\" loading=\"eager\"><button type=\"button\" class=\"ud-btn ud-btn-medium ud-btn-link ud-btn-text-sm open-full-size-image--backdrop--Zor3j\"><svg aria-label=\"Larger image\" role=\"img\" focusable=\"false\" class=\"ud-icon ud-icon-large ud-icon-color-neutral\"><use xlink:href=\"#icon-search\"></use></svg></button></div></span>\nvia - <a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-target-tracking.html\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-target-tracking.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Configure the Auto Scaling group to use step scaling policy and set the CPU utilization as the target metric with a target value of 50%</strong></p>\n\n<p><strong>Configure the Auto Scaling group to use simple scaling policy and set the CPU utilization as the target metric with a target value of 50%</strong></p>\n\n<p>With step scaling and simple scaling, you choose scaling metrics and threshold values for the Amazon CloudWatch alarms that trigger the scaling process.\nNeither step scaling nor simple scaling can be configured to use a target metric for CPU utilization, hence both these options are incorrect.</p>\n\n<p><strong>Configure the Auto Scaling group to use a Amazon Cloudwatch alarm triggered on a CPU utilization threshold of 50%</strong> - An Auto Scaling group cannot directly use a Cloudwatch alarm as the source for a scale-in or scale-out event, hence this option is incorrect.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/AutoScalingGroup.html\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/AutoScalingGroup.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-target-tracking.html\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-target-tracking.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-simple-step.html\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-simple-step.html</a></p>\n"
  },
  {
    "question": "<p>A company runs a data processing workflow that takes about 60 minutes to complete. The workflow can withstand disruptions and it can be started and stopped multiple times.</p>\n\n<p>Which is the most cost-effective solution to build a solution for the workflow?</p>",
    "options": [],
    "correctAnswerIndices": [],
    "explanation": "<p>Correct option:</p>\n\n<p><strong>Use Amazon EC2 spot instances to run the workflow processes</strong></p>\n\n<p>Amazon EC2 instance types:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q21-i1.jpg\" style=\"display: none;\"><span class=\"ud-component--base-components--open-full-size-image\"><div class=\"open-full-size-image--wrapper--R4gIm\" data-purpose=\"open-full-size-image\"><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q21-i1.jpg\" alt=\"\" loading=\"eager\"><button type=\"button\" class=\"ud-btn ud-btn-medium ud-btn-link ud-btn-text-sm open-full-size-image--backdrop--Zor3j\"><svg aria-label=\"Larger image\" role=\"img\" focusable=\"false\" class=\"ud-icon ud-icon-large ud-icon-color-neutral\"><use xlink:href=\"#icon-search\"></use></svg></button></div></span>\nvia - <a href=\"https://aws.amazon.com/ec2/pricing/\">https://aws.amazon.com/ec2/pricing/</a></p>\n\n<p>Amazon EC2 Spot instances allow you to request spare Amazon EC2 computing capacity for up to 90% off the On-Demand price.</p>\n\n<p>Spot instances are recommended for:</p>\n\n<p>Applications that have flexible start and end times\nApplications that are feasible only at very low compute prices\nUsers with urgent computing needs for large amounts of additional capacity</p>\n\n<p>For the given use case, spot instances offer the most cost-effective solution as the workflow can withstand disruptions and can be started and stopped multiple times.</p>\n\n<p>For example, considering a process that runs for an hour and needs about 1024 MB of memory, spot instance pricing for a t2.micro instance (having 1024 MB of RAM) is $0.0035 per hour.</p>\n\n<p>Spot instance pricing:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q21-i2.jpg\" style=\"display: none;\"><span class=\"ud-component--base-components--open-full-size-image\"><div class=\"open-full-size-image--wrapper--R4gIm\" data-purpose=\"open-full-size-image\"><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q21-i2.jpg\" alt=\"\" loading=\"eager\"><button type=\"button\" class=\"ud-btn ud-btn-medium ud-btn-link ud-btn-text-sm open-full-size-image--backdrop--Zor3j\"><svg aria-label=\"Larger image\" role=\"img\" focusable=\"false\" class=\"ud-icon ud-icon-large ud-icon-color-neutral\"><use xlink:href=\"#icon-search\"></use></svg></button></div></span>\nvia - <a href=\"https://aws.amazon.com/ec2/spot/pricing/\">https://aws.amazon.com/ec2/spot/pricing/</a></p>\n\n<p>Contrast this with the pricing of a Lambda function (having 1024 MB of allocated memory), which comes out to $0.0000000167 per 1ms or $0.06 per hour ($0.0000000167 * 1000 * 60  * 60 per hour).</p>\n\n<p>AWS Lambda function pricing:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q21-i3.jpg\" style=\"display: none;\"><span class=\"ud-component--base-components--open-full-size-image\"><div class=\"open-full-size-image--wrapper--R4gIm\" data-purpose=\"open-full-size-image\"><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q21-i3.jpg\" alt=\"\" loading=\"eager\"><button type=\"button\" class=\"ud-btn ud-btn-medium ud-btn-link ud-btn-text-sm open-full-size-image--backdrop--Zor3j\"><svg aria-label=\"Larger image\" role=\"img\" focusable=\"false\" class=\"ud-icon ud-icon-large ud-icon-color-neutral\"><use xlink:href=\"#icon-search\"></use></svg></button></div></span>\nvia - <a href=\"https://aws.amazon.com/lambda/pricing/\">https://aws.amazon.com/lambda/pricing/</a></p>\n\n<p>Thus, a spot instance turns out to be about 20 times cost effective than a Lambda function to meet the requirements of the given use case.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use AWS Lambda function to run the workflow processes</strong> - As mentioned in the explanation above, a Lambda function turns out to be 20 times more expensive than a spot instance to meet the workflow requirements of the given use case, so this option is incorrect. You should also note that the maximum execution time of a Lambda function is 15 minutes, so the workflow process would be disrupted for sure. On the other hand, it is certainly possible that the workflow process can be completed in a single run on the spot instance (the average frequency of stop instance interruption across all Regions and instance types is &lt;10%).</p>\n\n<p><strong>Use Amazon EC2 on-demand instances to run the workflow processes</strong></p>\n\n<p><strong>Use Amazon EC2 reserved instances to run the workflow processes</strong></p>\n\n<p>You should note that both on-demand and reserved instances are more expensive than spot instances. In addition, reserved instances have a term of 1 year or 3 years, so they are not suited for the given workflow. Therefore, both these options are incorrect.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/ec2/pricing/\">https://aws.amazon.com/ec2/pricing/</a></p>\n\n<p><a href=\"https://aws.amazon.com/ec2/spot/pricing/\">https://aws.amazon.com/ec2/spot/pricing/</a></p>\n\n<p><a href=\"https://aws.amazon.com/lambda/pricing/\">https://aws.amazon.com/lambda/pricing/</a></p>\n\n<p><a href=\"https://aws.amazon.com/ec2/spot/instance-advisor/\">https://aws.amazon.com/ec2/spot/instance-advisor/</a></p>\n"
  },
  {
    "question": "<p>The development team at an e-commerce startup has set up multiple microservices running on Amazon EC2 instances under an Application Load Balancer. The team wants to route traffic to multiple back-end services based on the URL path of the HTTP header. So it wants requests for https://www.example.com/orders to go to a specific microservice and requests for https://www.example.com/products to go to another microservice.</p>\n\n<p>Which of the following features of Application Load Balancers can be used for this use-case?</p>",
    "options": [],
    "correctAnswerIndices": [],
    "explanation": "<p>Correct option:</p>\n\n<p><strong>Path-based Routing</strong></p>\n\n<p>Elastic Load Balancing automatically distributes incoming application traffic across multiple targets, such as Amazon EC2 instances, containers, IP addresses, and AWS Lambda functions.</p>\n\n<p>If your application is composed of several individual services, an Application Load Balancer can route a request to a service based on the content of the request. Here are the different types -</p>\n\n<p>Host-based Routing:</p>\n\n<p>You can route a client request based on the Host field of the HTTP header allowing you to route to multiple domains from the same load balancer.</p>\n\n<p>Path-based Routing:</p>\n\n<p>You can route a client request based on the URL path of the HTTP header.</p>\n\n<p>HTTP header-based routing:</p>\n\n<p>You can route a client request based on the value of any standard or custom HTTP header.</p>\n\n<p>HTTP method-based routing:</p>\n\n<p>You can route a client request based on any standard or custom HTTP method.</p>\n\n<p>Query string parameter-based routing:</p>\n\n<p>You can route a client request based on the query string or query parameters.</p>\n\n<p>Source IP address CIDR-based routing:</p>\n\n<p>You can route a client request based on source IP address CIDR from where the request originates.</p>\n\n<p>Path-based Routing Overview:</p>\n\n<p>You can use path conditions to define rules that route requests based on the URL in the request (also known as path-based routing).</p>\n\n<p>The path pattern is applied only to the path of the URL, not to its query parameters.\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q48-i1.jpg\" style=\"display: none;\"><span class=\"ud-component--base-components--open-full-size-image\"><div class=\"open-full-size-image--wrapper--R4gIm\" data-purpose=\"open-full-size-image\"><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q48-i1.jpg\" alt=\"\" loading=\"eager\"><button type=\"button\" class=\"ud-btn ud-btn-medium ud-btn-link ud-btn-text-sm open-full-size-image--backdrop--Zor3j\"><svg aria-label=\"Larger image\" role=\"img\" focusable=\"false\" class=\"ud-icon ud-icon-large ud-icon-color-neutral\"><use xlink:href=\"#icon-search\"></use></svg></button></div></span>\nvia - <a href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-listeners.html#path-conditions\">https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-listeners.html#path-conditions</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Query string parameter-based routing</strong></p>\n\n<p><strong>HTTP header-based routing</strong></p>\n\n<p><strong>Host-based Routing</strong></p>\n\n<p>As mentioned earlier in the explanation, none of these three types of routing support requests based on the URL path of the HTTP header. Hence these three are incorrect.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-listeners.html\">https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-listeners.html</a></p>\n"
  },
  {
    "question": "<p>A digital wallet company plans to launch a new cloud-based service for processing user cash transfers and peer-to-peer payments. The application will receive transaction requests from mobile clients via a secure endpoint. Each transaction request must go through a lightweight validation step before being forwarded for backend processing, which includes fraud detection, ledger updates, and notifications. The backend workload is compute- and memory-intensive, requires scaling based on volume, and must run for a longer duration than typical short-lived tasks. The engineering team prefers a fully managed solution that minimizes infrastructure maintenance, including provisioning and patching of virtual machines or containers.</p>\n\n<p>Which solution will meet these requirements with the LEAST operational overhead?</p>",
    "options": [],
    "correctAnswerIndices": [],
    "explanation": "<p>Correct option:</p>\n\n<p><strong>Expose an Amazon API Gateway REST API endpoint to receive transaction requests from mobile clients. Integrate the API with AWS Lambda to perform basic validation. For backend processing, deploy the long-running application to Amazon ECS using the Fargate launch type, allowing ECS to manage compute and memory provisioning automatically, with no server management required</strong></p>\n\n<p>This architecture uses Amazon API Gateway to securely expose a RESTful endpoint, which integrates seamlessly with AWS Lambda for the lightweight validation logic. Once validated, the data is passed to Amazon ECS running on Fargate, a serverless container orchestration service that automatically provisions compute and memory resources based on task definitions. ECS with Fargate eliminates the need for cluster management, OS patching, or infrastructure provisioning. This makes the solution fully managed, highly scalable, and the most operationally efficient for long-running backend tasks.</p>\n\n<p>What is serverless development?\n<img src=\"https://docs.aws.amazon.com/images/serverless/latest/devguide/images/path-serverless-overview.png\" style=\"display: none;\"><span class=\"ud-component--base-components--open-full-size-image\"><div class=\"open-full-size-image--wrapper--R4gIm\" data-purpose=\"open-full-size-image\"><img src=\"https://docs.aws.amazon.com/images/serverless/latest/devguide/images/path-serverless-overview.png\" alt=\"\" loading=\"eager\"><button type=\"button\" class=\"ud-btn ud-btn-medium ud-btn-link ud-btn-text-sm open-full-size-image--backdrop--Zor3j\"><svg aria-label=\"Larger image\" role=\"img\" focusable=\"false\" class=\"ud-icon ud-icon-large ud-icon-color-neutral\"><use xlink:href=\"#icon-search\"></use></svg></button></div></span>\nvia - <a href=\"https://docs.aws.amazon.com/serverless/latest/devguide/welcome.html\">https://docs.aws.amazon.com/serverless/latest/devguide/welcome.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Build a REST API using Amazon API Gateway. Integrate it with an AWS Step Functions state machine for validation. Launch the backend application using Amazon EKS with self-managed nodes, and use Kubernetes Jobs to handle transaction processing workflows. Manually scale the cluster based on demand</strong> - Although Step Functions can manage workflows and EKS supports containerized apps, EKS with self-managed nodes introduces infrastructure complexity. You must provision and manage the worker nodes, monitor Kubernetes components, and maintain security patches. This goes against the company's requirement to avoid managing infrastructure. Step Functions is also less ideal for handling synchronous validation of lightweight logic, where Lambda is more cost-effective.</p>\n\n<p><strong>Configure Amazon SQS to receive encrypted payment notifications from mobile devices. Use Amazon EventBridge rules to extract the payload and perform validation. Route the messages to a backend system hosted on Amazon Lightsail instances with dynamic scaling policies based on memory thresholds and instance health checks</strong> - This approach combines messaging and routing but uses Amazon Lightsail, which is designed for simplified hosting of websites and smaller applications. While Lightsail supports scaling policies, it lacks the advanced orchestration, scalability, and managed features needed for enterprise-grade backend processing. Additionally, using EventBridge for validation is not correct — it’s a routing service, not a transformation or logic execution engine.</p>\n\n<p><strong>Create an Amazon API Gateway endpoint to receive transaction requests from mobile devices. Use AWS Lambda to validate the transactions. For backend processing, deploy the application on Amazon EKS Anywhere, running on on-premises servers in the company’s data center. Use a custom provisioning script to scale Kubernetes worker nodes based on transaction volume</strong> - This solution introduces unnecessary infrastructure management, which contradicts the company's requirement to avoid managing infrastructure. Amazon EKS Anywhere is intended for organizations that need to run Kubernetes on-premises, often for latency, compliance, or hybrid cloud scenarios. However, it requires you to manage the entire infrastructure stack, including hardware, networking, OS patches, Kubernetes upgrades, and worker node scaling. That adds significant operational overhead, making it unsuitable for a team prioritizing low-maintenance, cloud-native solutions.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/AWS_Fargate.html\">https://docs.aws.amazon.com/AmazonECS/latest/developerguide/AWS_Fargate.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/apigateway/latest/developerguide/welcome.html\">https://docs.aws.amazon.com/apigateway/latest/developerguide/welcome.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/serverless/latest/devguide/welcome.html\">https://docs.aws.amazon.com/serverless/latest/devguide/welcome.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-set-up-simple-proxy.html\">https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-set-up-simple-proxy.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/eks/eks-anywhere/\">https://aws.amazon.com/eks/eks-anywhere/</a></p>\n"
  },
  {

o distribute your data and processing across a resizable cluster of Amazon EC2 instances.\nEMR does not offer the same storage and processing speed as FSx for Lustre. So it is not the right fit for the given high-performance workflow scenario.</p>\n\n<p><strong>AWS Glue</strong> - AWS Glue is a fully managed extract, transform, and load (ETL) service that makes it easy for customers to prepare and load their data for analytics. AWS Glue job is meant to be used for batch ETL data processing.\nAWS Glue does not offer the same storage and processing speed as FSx for Lustre. So it is not the right fit for the given high-performance workflow scenario.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/fsx/lustre/\">https://aws.amazon.com/fsx/lustre/</a></p>\n\n<p><a href=\"https://aws.amazon.com/fsx/windows/faqs/\">https://aws.amazon.com/fsx/windows/faqs/</a></p>\n"
