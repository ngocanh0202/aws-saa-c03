    "question": "<p>A technology blogger wants to write a review on the comparative pricing for various storage types available on AWS Cloud. The blogger has created a test file of size 1 gigabytes with some random data. Next he copies this test file into AWS S3 Standard storage class, provisions an Amazon EBS volume (General Purpose SSD (gp2)) with 100 gigabytes of provisioned storage and copies the test file into the Amazon EBS volume, and lastly copies the test file into an Amazon EFS Standard Storage filesystem. At the end of the month, he analyses the bill for costs incurred on the respective storage types for the test file.</p>\n\n<p>What is the correct order of the storage charges incurred for the test file on these three storage types?</p>",
    "options": [],
    "correctAnswerIndices": [],
    "explanation": "<p>Correct option:</p>\n\n<p><strong>Cost of test file storage on Amazon S3 Standard &lt; Cost of test file storage on Amazon EFS &lt; Cost of test file storage on Amazon EBS</strong></p>\n\n<p>With Amazon EFS, you pay only for the resources that you use. The Amazon EFS Standard Storage pricing is $0.30 per GB per month. Therefore the cost for storing the test file on EFS is $0.30 for the month.</p>\n\n<p>For Amazon EBS General Purpose SSD (gp2) volumes, the charges are $0.10 per GB-month of provisioned storage. Therefore, for a provisioned storage of 100GB for this use-case, the monthly cost on EBS is $0.10*100 = $10. This cost is irrespective of how much storage is actually consumed by the test file.</p>\n\n<p>For S3 Standard storage, the pricing is $0.023 per GB per month. Therefore, the monthly storage cost on S3 for the test file is $0.023.</p>\n\n<p>Therefore this is the correct option.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Cost of test file storage on Amazon S3 Standard &lt; Cost of test file storage on Amazon EBS &lt; Cost of test file storage on Amazon EFS</strong></p>\n\n<p><strong>Cost of test file storage on Amazon EFS &lt; Cost of test file storage on Amazon S3 Standard &lt; Cost of test file storage on Amazon EBS</strong></p>\n\n<p><strong>Cost of test file storage on Amazon EBS &lt; Cost of test file storage on Amazon S3 Standard &lt; Cost of test file storage on Amazon EFS</strong></p>\n\n<p>Following the computations shown earlier in the explanation, these three options are incorrect.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/ebs/pricing/\">https://aws.amazon.com/ebs/pricing/</a></p>\n\n<p>https://aws.amazon.com/s3/pricing/(https://aws.amazon.com/s3/pricing/)</p>\n\n<p><a href=\"https://aws.amazon.com/efs/pricing/\">https://aws.amazon.com/efs/pricing/</a></p>\n"
  },
  {
    "question": "<p>An audit department generates and accesses the audit reports only twice in a financial year. The department uses AWS Step Functions to orchestrate the report creating process that has failover and retry scenarios built into the solution. The underlying data to create these audit reports is stored on Amazon S3, runs into hundreds of Terabytes and should be available with millisecond latency.</p>\n\n<p>As an AWS Certified Solutions Architect – Associate, which is the MOST cost-effective storage class that you would recommend to be used for this use-case?</p>",
    "options": [],
    "correctAnswerIndices": [],
    "explanation": "<p>Correct option:</p>\n\n<p><strong>Amazon S3 Standard-Infrequent Access (S3 Standard-IA)</strong></p>\n\n<p>Since the data is accessed only twice in a financial year but needs rapid access when required, the most cost-effective storage class for this use-case is Amazon S3 Standard-IA. S3 Standard-IA storage class is for data that is accessed less frequently but requires rapid access when needed. S3 Standard-IA matches the high durability, high throughput, and low latency of S3 Standard, with a low per GB storage price and per GB retrieval fee. Amazon Standard-IA is designed for 99.9% availability compared to 99.99% availability of Amazon S3 Standard. However, the report creation process has failover and retry scenarios built into the workflow, so in case the data is not available owing to the 99.9% availability of Amazon S3 Standard-IA, the job will be auto re-invoked till data is successfully retrieved. Therefore this is the correct option.</p>\n\n<p>Amazon S3 Storage Classes Overview:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q15-i1.jpg\" style=\"display: none;\"><span class=\"ud-component--base-components--open-full-size-image\"><div class=\"open-full-size-image--wrapper--R4gIm\" data-purpose=\"open-full-size-image\"><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q15-i1.jpg\" alt=\"\" loading=\"eager\"><button type=\"button\" class=\"ud-btn ud-btn-medium ud-btn-link ud-btn-text-sm open-full-size-image--backdrop--Zor3j\"><svg aria-label=\"Larger image\" role=\"img\" focusable=\"false\" class=\"ud-icon ud-icon-large ud-icon-color-neutral\"><use xlink:href=\"#icon-search\"></use></svg></button></div></span>\nvia - <a href=\"https://aws.amazon.com/s3/storage-classes/\">https://aws.amazon.com/s3/storage-classes/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Amazon S3 Standard</strong> - Amazon S3 Standard offers high durability, availability, and performance object storage for frequently accessed data. As described above, Amazon S3 Standard-IA storage is a better fit than Amazon S3 Standard, hence using S3 standard is ruled out for the given use-case.</p>\n\n<p><strong>Amazon S3 Intelligent-Tiering (S3 Intelligent-Tiering)</strong> - For a small monthly object monitoring and automation charge, Amazon S3 Intelligent-Tiering monitors access patterns and automatically moves objects that have not been accessed to lower-cost access tiers. The Amazon S3 Intelligent-Tiering storage class is designed to optimize costs by automatically moving data to the most cost-effective access tier, without performance impact or operational overhead. S3 Standard-IA matches the high durability, high throughput, and low latency of S3 Intelligent-Tiering, with a low per GB storage price and per GB retrieval fee. Moreover, Standard-IA has the same availability as that of Amazon S3 Intelligent-Tiering. So, it's cost-efficient to use S3 Standard-IA instead of S3 Intelligent-Tiering.</p>\n\n<p><strong>Amazon S3 Glacier Deep Archive</strong> - Amazon S3 Glacier Deep Archive is a secure, durable, and low-cost storage class for data archiving. Amazon S3 Glacier Deep Archive does not support millisecond latency, so this option is ruled out.</p>\n\n<p>For more details on the durability, availability, cost and access latency - please review this reference link:\n<a href=\"https://aws.amazon.com/s3/storage-classes\">https://aws.amazon.com/s3/storage-classes</a></p>\n"
  },
  {
    "question": "<p>While consolidating logs for the weekly reporting, a development team at an e-commerce company noticed that an unusually large number of illegal AWS application programming interface (API) queries were made sometime during the week. Due to the off-season, there was no visible impact on the systems. However, this event led the management team to seek an automated solution that can trigger near-real-time warnings in case such an event recurs.</p>\n\n<p>Which of the following represents the best solution for the given scenario?</p>",
    "options": [],
    "correctAnswerIndices": [],
    "explanation": "<p>Correct option:</p>\n\n<p><strong>Create an Amazon CloudWatch metric filter that processes AWS CloudTrail logs having API call details and looks at any errors by factoring in all the error codes that need to be tracked. Create an alarm based on this metric's rate to send an Amazon SNS notification to the required team</strong></p>\n\n<p>AWS CloudTrail log data can be ingested into Amazon CloudWatch to monitor and identify your AWS account activity against security threats, and create a governance framework for security best practices. You can analyze log trail event data in CloudWatch using features such as Logs Insight, Contributor Insights, Metric filters, and CloudWatch Alarms.</p>\n\n<p>AWS CloudTrail integrates with the Amazon CloudWatch service to publish the API calls being made to resources or services in the AWS account. The published event has invaluable information that can be used for compliance, auditing, and governance of your AWS accounts. Below we introduce several features available in CloudWatch to monitor API activity, analyze the logs at scale, and take action when malicious activity is discovered, without provisioning your infrastructure.</p>\n\n<p>For the AWS Cloudtrail logs available in Amazon CloudWatch Logs, you can begin searching and filtering the log data by creating one or more metric filters. Use these metric filters to turn log data into numerical CloudWatch metrics that you can graph or set a CloudWatch Alarm on.</p>\n\n<p>Note: AWS CloudTrail Insights helps AWS users identify and respond to unusual activity associated with <code>write</code> API calls by continuously analyzing CloudTrail management events.</p>\n\n<p>Insights events are logged when AWS CloudTrail detects unusual <code>write</code> management API activity in your account. If you have AWS CloudTrail Insights enabled and CloudTrail detects unusual activity, Insights events are delivered to the destination Amazon S3 bucket for your trail. You can also see the type of insight and the incident time when you view Insights events on the CloudTrail console. Unlike other types of events captured in a CloudTrail trail, Insights events are logged only when CloudTrail detects changes in your account's API usage that differ significantly from the account's typical usage patterns.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Configure AWS CloudTrail to stream event data to Amazon Kinesis. Use Amazon Kinesis stream-level metrics in the Amazon CloudWatch to trigger an AWS Lambda function that will trigger an error workflow</strong> -  AWS CloudTrail cannot stream data to Amazon Kinesis. Amazon S3 buckets and Amazon CloudWatch logs are the only destinations possible.</p>\n\n<p><strong>Run Amazon Athena SQL queries against AWS CloudTrail log files stored in Amazon S3 buckets. Use Amazon QuickSight to generate reports for managerial dashboards</strong> - Generating reports and visualizations help in understanding and analyzing patterns but is not useful as a near-real-time automatic solution for the given problem.</p>\n\n<p><strong>AWS Trusted Advisor publishes metrics about check results to Amazon CloudWatch. Create an alarm to track status changes for checks in the Service Limits category for the APIs. The alarm will then notify when the service quota is reached or exceeded</strong> - When AWS Trusted Advisor refreshes your checks, Trusted Advisor publishes metrics about your check results to Amazon CloudWatch. You can view the metrics in CloudWatch. You can also create alarms to detect status changes to Trusted Advisor checks and status changes for resources, and service quota usage (formerly referred to as limits). The alarm will then notify you when you reach or exceed a service quota for your AWS account. However, the alarm is triggered only when the service limit is reached. We need a solution that raises an alarm when the number of API calls randomly increases or an abnormal pattern is detected. Hence, this option is not the right fit for the given use case.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudwatch-alarms-for-cloudtrail.html#cloudwatch-alarms-for-cloudtrail-authorization-failures\">https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudwatch-alarms-for-cloudtrail.html#cloudwatch-alarms-for-cloudtrail-authorization-failures</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-concepts.html\">https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-concepts.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-insights-events-with-cloudtrail.html\">https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-insights-events-with-cloudtrail.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/awssupport/latest/user/cloudwatch-metrics-ta.html\">https://docs.aws.amazon.com/awssupport/latest/user/cloudwatch-metrics-ta.html</a></p>\n"
  },
  {
    "question": "<p>A news network uses Amazon Simple Storage Service (Amazon S3) to aggregate the raw video footage from its reporting teams across the US. The news network has recently expanded into new geographies in Europe and Asia. The technical teams at the overseas branch offices have reported huge delays in uploading large video files to the destination Amazon S3 bucket.</p>\n\n<p>Which of the following are the MOST cost-effective options to improve the file upload speed into Amazon S3 (Select two)</p>",
    "options": [],
    "correctAnswerIndices": [],
    "explanation": "<p>Correct options:</p>\n\n<p><strong>Use Amazon S3 Transfer Acceleration (Amazon S3TA) to enable faster file uploads into the destination S3 bucket</strong></p>\n\n<p>Amazon S3 Transfer Acceleration enables fast, easy, and secure transfers of files over long distances between your client and an S3 bucket. Amazon S3TA takes advantage of Amazon CloudFront’s globally distributed edge locations. As the data arrives at an edge location, data is routed to Amazon S3 over an optimized network path.</p>\n\n<p><strong>Use multipart uploads for faster file uploads into the destination Amazon S3 bucket</strong></p>\n\n<p>Multipart upload allows you to upload a single object as a set of parts. Each part is a contiguous portion of the object's data. You can upload these object parts independently and in any order. If transmission of any part fails, you can retransmit that part without affecting other parts. After all parts of your object are uploaded, Amazon S3 assembles these parts and creates the object. In general, when your object size reaches 100 MB, you should consider using multipart uploads instead of uploading the object in a single operation. Multipart upload provides improved throughput, therefore it facilitates faster file uploads.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Create multiple AWS Direct Connect connections between the AWS Cloud and branch offices in Europe and Asia. Use the direct connect connections for faster file uploads into Amazon S3</strong> - AWS Direct Connect is a cloud service solution that makes it easy to establish a dedicated network connection from your premises to AWS. AWS Direct Connect lets you establish a dedicated network connection between your network and one of the AWS Direct Connect locations.\nDirect connect takes significant time (several months) to be provisioned and is an overkill for the given use-case.</p>\n\n<p><strong>Create multiple AWS Site-to-Site VPN connections between the AWS Cloud and branch offices in Europe and Asia. Use these VPN connections for faster file uploads into Amazon S3</strong> - AWS Site-to-Site VPN enables you to securely connect your on-premises network or branch office site to your Amazon Virtual Private Cloud (Amazon VPC). You can securely extend your data center or branch office network to the cloud with an AWS Site-to-Site VPN connection. A VPC VPN Connection utilizes IPSec to establish encrypted network connectivity between your intranet and Amazon VPC over the Internet.\nVPN Connections are a good solution if you have low to modest bandwidth requirements and can tolerate the inherent variability in Internet-based connectivity. Site-to-site VPN will not help in accelerating the file transfer speeds into S3 for the given use-case.</p>\n\n<p><strong>Use AWS Global Accelerator for faster file uploads into the destination Amazon S3 bucket</strong> - AWS Global Accelerator is a service that improves the availability and performance of your applications with local or global users. It provides static IP addresses that act as a fixed entry point to your application endpoints in a single or multiple AWS Regions, such as your Application Load Balancers, Network Load Balancers or Amazon EC2 instances. AWS Global Accelerator will not help in accelerating the file transfer speeds into S3 for the given use-case.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/dev/transfer-acceleration.html\">https://docs.aws.amazon.com/AmazonS3/latest/dev/transfer-acceleration.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/dev/uploadobjusingmpu.html\">https://docs.aws.amazon.com/AmazonS3/latest/dev/uploadobjusingmpu.html</a></p>\n"
  },
  {
    "question": "<p>A retail company runs a customer management system backed by a Microsoft SQL Server database. The system is tightly integrated with applications that rely on T-SQL queries. The company wants to modernize its infrastructure by migrating to Amazon Aurora PostgreSQL, but it needs to avoid major modifications to the existing application logic.</p>\n\n<p>Which combination of actions should the company take to achieve this goal with minimal application refactoring? (Select two)</p>",
    "options": [],
    "correctAnswerIndices": [],
    "explanation": "<p>Correct options:</p>\n\n<p><strong>Deploy Babelfish for Aurora PostgreSQL to enable support for T-SQL commands</strong></p>\n\n<p>Babelfish allows Aurora PostgreSQL to understand T-SQL (Microsoft SQL Server's query language) and SQL Server wire protocol, enabling applications to communicate with Aurora using SQL Server-style queries with minimal code changes. This is ideal for minimizing application code refactoring.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q47-i4.jpg\" style=\"display: none;\"><span class=\"ud-component--base-components--open-full-size-image\"><div class=\"open-full-size-image--wrapper--R4gIm\" data-purpose=\"open-full-size-image\"><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q47-i4.jpg\" alt=\"\" loading=\"eager\"><button type=\"button\" class=\"ud-btn ud-btn-medium ud-btn-link ud-btn-text-sm open-full-size-image--backdrop--Zor3j\"><svg aria-label=\"Larger image\" role=\"img\" focusable=\"false\" class=\"ud-icon ud-icon-large ud-icon-color-neutral\"><use xlink:href=\"#icon-search\"></use></svg></button></div></span>\nvia - <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/babelfish.html\">https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/babelfish.html</a></p>\n\n<p><strong>Use AWS Schema Conversion Tool (AWS SCT) along with AWS Database Migration Service (AWS DMS) to migrate the schema and data</strong></p>\n\n<p>The AWS Schema Conversion Tool (SCT) helps convert the SQL Server schema to PostgreSQL-compatible syntax, and AWS Database Migration Service (DMS) can move the actual data with minimal downtime. These tools are designed for database migration and are essential for schema and data transfer.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Configure Amazon Aurora PostgreSQL with a custom endpoint that emulates Microsoft SQL Server behavior</strong> -  Aurora endpoints do not provide protocol-level emulation of SQL Server unless Babelfish is explicitly enabled. There is no feature to make Aurora natively emulate SQL Server behavior without Babelfish.</p>\n\n<p><strong>Use Amazon Aurora Global Database to replicate data across regions for compatibility</strong> - Aurora Global Database helps with cross-region disaster recovery and read scalability, but it does not assist with SQL Server compatibility or reduce application code changes.</p>\n\n<p><strong>Use AWS Glue to convert T-SQL queries to PostgreSQL-compatible SQL during the migration</strong> - AWS Glue is primarily used for ETL and data transformation, not for application SQL query conversion. It cannot translate T-SQL into PostgreSQL syntax.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/babelfish.html\">https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/babelfish.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/babelfish-compatibility.html\">https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/babelfish-compatibility.html</a></p>\n"
  },
  {
    "question": "<p>A leading video streaming service delivers billions of hours of content from Amazon Simple Storage Service (Amazon S3) to customers around the world. Amazon S3 also serves as the data lake for its big data analytics solution. The data lake has a staging zone where intermediary query results are kept only for 24 hours. These results are also heavily referenced by other parts of the analytics pipeline.</p>\n\n<p>Which of the following is the MOST cost-effective strategy for storing this intermediary query data?</p>",
    "options": [],
    "correctAnswerIndices": [],
    "explanation": "<p>Correct option:</p>\n\n<p><strong>Store the intermediary query results in Amazon S3 Standard storage class</strong></p>\n\n<p>Amazon S3 Standard offers high durability, availability, and performance object storage for frequently accessed data. Because it delivers low latency and high throughput, S3 Standard is appropriate for a wide variety of use cases, including cloud applications, dynamic websites, content distribution, mobile and gaming applications, and big data analytics.\nAs there is no minimum storage duration charge and no retrieval fee (remember that intermediary query results are heavily referenced by other parts of the analytics pipeline), this is the MOST cost-effective storage class amongst the given options.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Store the intermediary query results in Amazon S3 Glacier Instant Retrieval storage class</strong> - Amazon S3 Glacier Instant Retrieval delivers the fastest access to archive storage, with the same throughput and milliseconds access as the S3 Standard and S3 Standard-IA storage classes. S3 Glacier Instant Retrieval is ideal for archive data that needs immediate access, such as medical images, news media assets, or user-generated content archives.</p>\n\n<p>The minimum storage duration charge is 90 days, so this option is NOT cost-effective because intermediary query results need to be kept only for 24 hours. Hence this option is not correct.</p>\n\n<p><strong>Store the intermediary query results in Amazon S3 Standard-Infrequent Access storage class</strong> - Amazon S3 Standard-IA is for data that is accessed less frequently but requires rapid access when needed. S3 Standard-IA offers high durability, high throughput, and low latency of S3 Standard, with a low per GB storage price and per GB retrieval fee. This combination of low cost and high performance makes S3 Standard-IA ideal for long-term storage, backups, and as a data store for disaster recovery files.\nThe minimum storage duration charge is 30 days, so this option is NOT cost-effective because intermediary query results need to be kept only for 24 hours. Hence this option is not correct.</p>\n\n<p><strong>Store the intermediary query results in Amazon S3 One Zone-Infrequent Access storage class</strong> - Amazon S3 One Zone-IA is for data that is accessed less frequently but requires rapid access when needed. Unlike other S3 Storage Classes which store data in a minimum of three Availability Zones (AZs), S3 One Zone-IA stores data in a single AZ and costs 20% less than S3 Standard-IA.\nThe minimum storage duration charge is 30 days, so this option is NOT cost-effective because intermediary query results need to be kept only for 24 hours. Hence this option is not correct.</p>\n\n<p>To summarize again, S3 Standard-IA and S3 One Zone-IA have a minimum storage duration charge of 30 days (so instead of 24 hours, you end up paying for 30 days). S3 Standard-IA and S3 One Zone-IA also have retrieval charges (as the results are heavily referenced by other parts of the analytics pipeline, so the retrieval costs would be pretty high). Therefore, these storage classes are not cost optimal for the given use-case.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://aws.amazon.com/s3/storage-classes/\">https://aws.amazon.com/s3/storage-classes/</a></p>\n"
  },
  {
    "question": "<p>An IT security consultancy is working on a solution to protect data stored in Amazon S3 from any malicious activity as well as check for any vulnerabilities on Amazon EC2 instances.</p>\n\n<p>As a solutions architect, which of the following solutions would you suggest to help address the given requirement?</p>",
    "options": [],
    "correctAnswerIndices": [],
    "explanation": "<p>Correct option:</p>\n\n<p><strong>Use Amazon GuardDuty to monitor any malicious activity on data stored in Amazon S3. Use security assessments provided by Amazon Inspector to check for vulnerabilities on Amazon EC2 instances</strong></p>\n\n<p>Amazon GuardDuty offers threat detection that enables you to continuously monitor and protect your AWS accounts, workloads, and data stored in Amazon S3. GuardDuty analyzes continuous streams of meta-data generated from your account and network activity found in AWS CloudTrail Events, Amazon VPC Flow Logs, and DNS Logs. It also uses integrated threat intelligence such as known malicious IP addresses, anomaly detection, and machine learning to identify threats more accurately.</p>\n\n<p>How Amazon GuardDuty works:\n<img src=\"https://d1.awsstatic.com/product-marketing/Amazon%20GuardDuty/product-page-diagram-Amazon-GuardDuty_how-it-works.a4daf7e3aaf3532623a3797dd3af606a85fc2e7b.png\" style=\"display: none;\"><span class=\"ud-component--base-components--open-full-size-image\"><div class=\"open-full-size-image--wrapper--R4gIm\" data-purpose=\"open-full-size-image\"><img src=\"https://d1.awsstatic.com/product-marketing/Amazon%20GuardDuty/product-page-diagram-Amazon-GuardDuty_how-it-works.a4daf7e3aaf3532623a3797dd3af606a85fc2e7b.png\" alt=\"\" loading=\"eager\"><button type=\"button\" class=\"ud-btn ud-btn-medium ud-btn-link ud-btn-text-sm open-full-size-image--backdrop--Zor3j\"><svg aria-label=\"Larger image\" role=\"img\" focusable=\"false\" class=\"ud-icon ud-icon-large ud-icon-color-neutral\"><use xlink:href=\"#icon-search\"></use></svg></button></div></span>\nvia - <a href=\"https://aws.amazon.com/guardduty/\">https://aws.amazon.com/guardduty/</a></p>\n\n<p>Amazon Inspector security assessments help you check for unintended network accessibility of your Amazon EC2 instances and for vulnerabilities on those EC2 instances. Amazon Inspector assessments are offered to you as pre-defined rules packages mapped to common security best practices and vulnerability definitions.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use Amazon GuardDuty to monitor any malicious activity on data stored in Amazon S3. Use security assessments provided by Amazon GuardDuty to check for vulnerabilities on Amazon EC2 instances</strong></p>\n\n<p><strong>Use Amazon Inspector to monitor any malicious activity on data stored in Amazon S3. Use security assessments provided by Amazon Inspector to check for vulnerabilities on Amazon EC2 instances</strong></p>\n\n<p><strong>Use Amazon Inspector to monitor any malicious activity on data stored in Amazon S3. Use security assessments provided by Amazon GuardDuty to check for vulnerabilities on Amazon EC2 instances</strong></p>\n\n<p>These three options contradict the explanation provided above, so these options are incorrect.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/guardduty/\">https://aws.amazon.com/guardduty/</a></p>\n\n<p><a href=\"https://aws.amazon.com/inspector/\">https://aws.amazon.com/inspector/</a></p>\n"
  },
  {
    "question": "<p>A digital event-ticketing platform hosts its core transaction-processing service on AWS. The service runs on Amazon EC2 instances and stores finalized transactions in an Amazon Aurora PostgreSQL database. During periods of high user activity - such as flash ticket sales or holiday promotions - the application begins timing out, causing failed or delayed purchases. A solutions architect has been asked to redesign the backend for scalability and cost-efficiency, without reengineering the database layer.</p>\n\n<p>Which combination of actions will meet these goals in the most cost-effective and scalable manner? (Select two)</p>",
    "options": [],
    "correctAnswerIndices": [],
    "explanation": "<p>Correct options:</p>\n\n<p><strong>Implement Amazon RDS Proxy between the application and the Aurora PostgreSQL cluster. Deploy EC2 instances in an Auto Scaling group to retry transactions as needed</strong></p>\n\n<p>Amazon RDS Proxy helps manage connection pooling and throttling, which are common causes of Aurora timeouts during high-load scenarios. It maintains a pool of database connections and reuses them across clients, reducing the overhead of frequent connection creation. Pairing this with an Auto Scaling group of EC2 instances ensures that application compute can scale dynamically based on demand. This combination improves application resiliency, reduces Aurora connection stress, and addresses peak usage efficiently and cost-effectively.</p>\n\n<p><strong>Modify the application to publish purchase events to an Amazon SQS queue. Launch an Auto Scaling group of EC2 workers that poll the queue and process purchases asynchronously</strong></p>\n\n<p>Introducing Amazon SQS decouples the web tier from the processing logic, allowing the system to buffer bursts in transaction load without overwhelming the database. EC2 workers in an Auto Scaling group can be dynamically scaled to consume and process queue messages based on throughput needs. This pattern ensures durability, resiliency, and elastic scalability, especially during peak usage. It's also cost-effective because compute usage grows and shrinks with actual demand.</p>\n\n<p>Incorrect Options:</p>\n\n<p><strong>Use an Amazon ElastiCache cluster to cache database queries. Configure the application to store purchase transactions in the cache before writing to the database</strong> - While ElastiCache is effective for read-heavy workloads, it’s not designed for durable transactional writes. Caching transactional data—especially before it is persisted in a database—risks data loss if the cache node fails. In addition, caching will not prevent database connection saturation under write-heavy load. This approach does not solve the scalability issues related to timeouts during concurrent write operations.</p>\n\n<p><strong>Deploy an Amazon API Gateway with throttling and usage plans to slow down incoming purchase requests during peak times and maintain application stability</strong> - While API Gateway usage plans and throttling can help protect backend services from overload, they do so by delaying or rejecting traffic, which could worsen the customer experience during peak demand. This does not address the need for backend scalability, and it doesn't improve throughput or processing capacity. Instead, it suppresses demand rather than meeting it.</p>\n\n<p><strong>Deploy read replicas for the Aurora database in another Region and configure EC2 instances to read and write from the nearest replica based on latency</strong> - This option acts as a distractor. While read replicas improve read scalability, they are read-only and cannot handle write traffic.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html\">https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/welcome.html\">https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/welcome.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/WhatIs.html\">https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/WhatIs.html</a></p>\n"
  },
  {
    "question": "<p>An IT company wants to review its security best-practices after an incident was reported where a new developer on the team was assigned full access to Amazon DynamoDB. The developer accidentally deleted a couple of tables from the production environment while building out a new feature.</p>\n\n<p>Which is the MOST effective way to address this issue so that such incidents do not recur?</p>",
    "options": [],
    "correctAnswerIndices": [],
    "explanation": "<p>Correct option:</p>\n\n<p><strong>Use permissions boundary to control the maximum permissions employees can grant to the IAM principals</strong></p>\n\n<p>A permissions boundary can be used to control the maximum permissions employees can grant to the IAM principals (that is, users and roles) that they create and manage. As the IAM administrator, you can define one or more permissions boundaries using managed policies and allow your employee to create a principal with this boundary. The employee can then attach a permissions policy to this principal. However, the effective permissions of the principal are the intersection of the permissions boundary and permissions policy. As a result, the new principal cannot exceed the boundary that you defined. Therefore, using the permissions boundary offers the right solution for this use-case.</p>\n\n<p>Permission Boundary Example:\n<img src=\"https://d2908q01vomqb2.cloudfront.net/22d200f8670dbdb3e253a90eee5098477c95c23d/2018/07/03/delegated-admin-02.png\" style=\"display: none;\"><span class=\"ud-component--base-components--open-full-size-image\"><div class=\"open-full-size-image--wrapper--R4gIm\" data-purpose=\"open-full-size-image\"><img src=\"https://d2908q01vomqb2.cloudfront.net/22d200f8670dbdb3e253a90eee5098477c95c23d/2018/07/03/delegated-admin-02.png\" alt=\"\" loading=\"eager\"><button type=\"button\" class=\"ud-btn ud-btn-medium ud-btn-link ud-btn-text-sm open-full-size-image--backdrop--Zor3j\"><svg aria-label=\"Larger image\" role=\"img\" focusable=\"false\" class=\"ud-icon ud-icon-large ud-icon-color-neutral\"><use xlink:href=\"#icon-search\"></use></svg></button></div></span>\nvia - <a href=\"https://aws.amazon.com/blogs/security/delegate-permission-management-to-developers-using-iam-permissions-boundaries/\">https://aws.amazon.com/blogs/security/delegate-permission-management-to-developers-using-iam-permissions-boundaries/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Remove full database access for all IAM users in the organization</strong> - It is not practical to remove full access for all IAM users in the organization because a select set of users need this access for database administration. So this option is not correct.</p>\n\n<p><strong>The CTO should review the permissions for each new developer's IAM user so that such incidents don't recur</strong> -  Likewise the CTO is not expected to review the permissions for each new developer's IAM user, as this is best done via an automated procedure. This option has been added as a distractor.</p>\n\n<p><strong>Only root user should have full database access in the organization</strong> - As a best practice, the root user should not access the AWS account to carry out any administrative procedures. So this option is not correct.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://aws.amazon.com/blogs/security/delegate-permission-management-to-developers-using-iam-permissions-boundaries/\">https://aws.amazon.com/blogs/security/delegate-permission-management-to-developers-using-iam-permissions-boundaries/</a></p>\n"
  },
  {
    "question": "<p>A media company runs a photo-sharing web application that is accessed across three different countries. The application is deployed on several Amazon Elastic Compute Cloud (Amazon EC2) instances running behind an Application Load Balancer. With new government regulations, the company has been asked to block access from two countries and allow access only from the home country of the company.</p>\n\n<p>Which configuration should be used to meet this changed requirement?</p>",
    "options": [],
    "correctAnswerIndices": [],
    "explanation": "<p>Correct option:</p>\n\n<p>AWS Web Application Firewall (AWS WAF) is a web application firewall service that lets you monitor web requests and protect your web applications from malicious requests. Use AWS WAF to block or allow requests based on conditions that you specify, such as the IP addresses. You can also use AWS WAF preconfigured protections to block common attacks like SQL injection or cross-site scripting.</p>\n\n<p><strong>Configure AWS Web Application Firewall (AWS WAF) on the Application Load Balancer in a Amazon Virtual Private Cloud (Amazon VPC)</strong></p>\n\n<p>You can use AWS WAF with your Application Load Balancer to allow or block requests based on the rules in a web access control list (web ACL). Geographic (Geo) Match Conditions in AWS WAF allows you to use AWS WAF to restrict application access based on the geographic location of your viewers. With geo match conditions you can choose the countries from which AWS WAF should allow access.</p>\n\n<p>Geo match conditions are important for many customers. For example, legal and licensing requirements restrict some customers from delivering their applications outside certain countries. These customers can configure a whitelist that allows only viewers in those countries. Other customers need to prevent the downloading of their encrypted software by users in certain countries. These customers can configure a blacklist so that end-users from those countries are blocked from downloading their software.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use Geo Restriction feature of Amazon CloudFront in a Amazon Virtual Private Cloud (Amazon VPC)</strong> - Geo Restriction feature of Amazon CloudFront helps in restricting traffic based on the user's geographic location. But, CloudFront works from edge locations and doesn't belong to a VPC. Hence, this option itself is incorrect and given only as a distractor.</p>\n\n<p><strong>Configure the security group on the Application Load Balancer</strong></p>\n\n<p><strong>Configure the security group for the Amazon EC2 instances</strong></p>\n\n<p>Security Groups cannot restrict access based on the user's geographic location.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/about-aws/whats-new/2017/10/aws-waf-now-supports-geographic-match/\">https://aws.amazon.com/about-aws/whats-new/2017/10/aws-waf-now-supports-geographic-match/</a></p>\n\n<p><a href=\"https://aws.amazon.com/blogs/aws/aws-web-application-firewall-waf-for-application-load-balancers/\">https://aws.amazon.com/blogs/aws/aws-web-application-firewall-waf-for-application-load-balancers/</a></p>\n\n<p><a href=\"https://aws.amazon.com/about-aws/whats-new/2016/12/AWS-WAF-now-available-on-Application-Load-Balancer/\">https://aws.amazon.com/about-aws/whats-new/2016/12/AWS-WAF-now-available-on-Application-Load-Balancer/</a></p>\n"
  },
  {
    "question": "<p>A file-hosting service uses Amazon Simple Storage Service (Amazon S3) under the hood to power its storage offerings. Currently all the customer files are uploaded directly under a single Amazon S3 bucket. The engineering team has started seeing scalability issues where customer file uploads have started failing during the peak access hours with more than 5000 requests per second.</p>\n\n<p>Which of the following is the MOST resource efficient and cost-optimal way of addressing this issue?</p>",
    "options": [],
    "correctAnswerIndices": [],
    "explanation": "<p>Correct option:</p>\n\n<p><strong>Change the application architecture to create customer-specific custom prefixes within the single Amazon S3 bucket and then upload the daily files into those prefixed locations</strong></p>\n\n<p>Amazon Simple Storage Service (Amazon S3) is an object storage service that offers industry-leading scalability, data availability, security, and performance. Your applications can easily achieve thousands of transactions per second in request performance when uploading and retrieving storage from Amazon S3. Amazon S3 automatically scales to high request rates. For example, your application can achieve at least 3,500 PUT/COPY/POST/DELETE or 5,500 GET/HEAD requests per second per prefix in a bucket.</p>\n\n<p>There are no limits to the number of prefixes in a bucket. You can increase your read or write performance by parallelizing reads. For example, if you create 10 prefixes in an Amazon S3 bucket to parallelize reads, you could scale your read performance to 55,000 read requests per second. Please see this example for more clarity on prefixes:\nif you have a file f1 stored in an S3 object path like so <code>s3://your_bucket_name/folder1/sub_folder_1/f1</code>, then <code>/folder1/sub_folder_1/</code> becomes the prefix for file f1.</p>\n\n<p>Some data lake applications on Amazon S3 scan millions or billions of objects for queries that run over petabytes of data. These data lake applications achieve single-instance transfer rates that maximize the network interface used for their Amazon EC2 instance, which can be up to 100 Gb/s on a single instance. These applications then aggregate throughput across multiple instances to get multiple terabits per second. Therefore creating customer-specific custom prefixes within the single bucket and then uploading the daily files into those prefixed locations is the BEST solution for the given constraints.</p>\n\n<p>Optimizing Amazon S3 Performance:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q51-i1.jpg\" style=\"display: none;\"><span class=\"ud-component--base-components--open-full-size-image\"><div class=\"open-full-size-image--wrapper--R4gIm\" data-purpose=\"open-full-size-image\"><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q51-i1.jpg\" alt=\"\" loading=\"eager\"><button type=\"button\" class=\"ud-btn ud-btn-medium ud-btn-link ud-btn-text-sm open-full-size-image--backdrop--Zor3j\"><svg aria-label=\"Larger image\" role=\"img\" focusable=\"false\" class=\"ud-icon ud-icon-large ud-icon-color-neutral\"><use xlink:href=\"#icon-search\"></use></svg></button></div></span>\nvia - <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/dev/optimizing-performance.html\">https://docs.aws.amazon.com/AmazonS3/latest/dev/optimizing-performance.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Change the application architecture to create a new Amazon S3 bucket for each customer and then upload each customer's files directly under the respective buckets</strong> - Creating a new Amazon S3 bucket for each new customer is an inefficient way of handling resource availability (S3 buckets need to be globally unique) as some customers may use the service sparingly but the bucket name is locked for them forever. Moreover, this is really not required as we can use S3 prefixes to improve the performance.</p>\n\n<p><strong>Change the application architecture to create a new Amazon S3 bucket for each day's data and then upload the daily files directly under that day's bucket</strong> - Creating a new Amazon S3 bucket for each new day's data is also an inefficient way of handling resource availability (S3 buckets need to be globally unique) as some of the bucket names may not be available for daily data processing. Moreover, this is really not required as we can use S3 prefixes to improve the performance.</p>\n\n<p><strong>Change the application architecture to use Amazon Elastic File System (Amazon EFS) instead of Amazon S3 for storing the customers' uploaded files</strong> - Amazon EFS is a costlier storage option compared to Amazon S3, so it is ruled out.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/dev/optimizing-performance.html\">https://docs.aws.amazon.com/AmazonS3/latest/dev/optimizing-performance.html</a></p>\n"
  },
  {
    "question": "<p>A healthcare analytics company centralizes clinical and operational datasets in an Amazon S3–based data lake. Incoming data is ingested in Apache Parquet format from multiple hospitals and wearable health devices. To ensure quality and standardization, the company applies several transformation steps: anomaly filtering, datetime normalization, and aggregation by patient cohort. The company needs a solution to support a code-free interface that enables data engineers and business analysts to collaborate on data preparation workflows. The company also requires data lineage tracking, data profiling capabilities, and an easy way to share transformation logic across teams without writing or managing code.</p>\n\n<p>Which AWS solution best meets these requirements?</p>",
    "options": [],
    "correctAnswerIndices": [],
    "explanation": "<p>Correct option:</p>\n\n<p><strong>Use AWS Glue DataBrew to visually build transformation workflows on top of the raw Parquet files in S3. Use DataBrew recipes to track, audit, and share the transformation steps with others. Enable data profiling to inspect column statistics, null values, and data types across datasets</strong></p>\n\n<p>AWS Glue DataBrew is a fully managed, serverless data preparation tool that enables users to visually clean, transform, and normalize raw datasets—all without writing any code. It is specifically designed for data analysts, business users, and data engineers who need to prepare data for analytics or machine learning workflows using an intuitive point-and-click interface.</p>\n\n<p>What is AWS Glue DataBrew?:\n<img src=\"https://docs.aws.amazon.com/images/databrew/latest/dg/images/databrew-overview-diagram.png\" style=\"display: none;\"><span class=\"ud-component--base-components--open-full-size-image\"><div class=\"open-full-size-image--wrapper--R4gIm\" data-purpose=\"open-full-size-image\"><img src=\"https://docs.aws.amazon.com/images/databrew/latest/dg/images/databrew-overview-diagram.png\" alt=\"\" loading=\"eager\"><button type=\"button\" class=\"ud-btn ud-btn-medium ud-btn-link ud-btn-text-sm open-full-size-image--backdrop--Zor3j\"><svg aria-label=\"Larger image\" role=\"img\" focusable=\"false\" class=\"ud-icon ud-icon-large ud-icon-color-neutral\"><use xlink:href=\"#icon-search\"></use></svg></button></div></span>\nvia - <a href=\"https://docs.aws.amazon.com/databrew/latest/dg/what-is.html\">https://docs.aws.amazon.com/databrew/latest/dg/what-is.html</a></p>\n\n<p>In the scenario, the company ingests Apache Parquet files into Amazon S3 and needs to apply multiple transformation steps such as anomaly filtering, standardizing date formats, and computing aggregates. With DataBrew, users can perform these tasks through a drag-and-drop UI and configure complex workflows using reusable “recipes”—collections of ordered transformation steps that can be saved, versioned, and shared with others in the organization.</p>\n\n<p>Furthermore, DataBrew provides built-in data profiling capabilities. It automatically generates column-level statistics such as distributions, cardinality, null value counts, standard deviations, and outlier detection. This visibility enables better data quality assessment before the data is used for reporting or machine learning.</p>\n\n<p>DataBrew’s recipe model supports auditability and traceability, satisfying the requirement for data lineage. All transformation steps are recorded and can be exported or replicated across projects. The output of a DataBrew job is written back to Amazon S3, keeping the transformed data accessible for downstream tools like Amazon Athena, Redshift, or QuickSight.</p>\n\n<p>Because it's serverless, there’s no infrastructure to manage, and it integrates seamlessly with other AWS services. This makes it ideal for teams that want a no-code, collaborative, auditable, and profile-rich data transformation tool for Parquet-based data lakes in S3.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use Amazon AppFlow to move and transform Parquet files in S3. Configure AppFlow transformations and mappings within the visual interface. Share flows with collaborators through AWS IAM policies and scheduled executions</strong> - Amazon AppFlow is used for data movement and basic transformation between SaaS applications (like Salesforce, Zendesk) and AWS services, but it does not support transforming or managing datasets already in S3 at scale. It also lacks comprehensive transformation workflows, data profiling, and data lineage capabilities required for complex ETL pipelines involving Parquet files.</p>\n\n<p><strong>Create Amazon Athena SQL queries to perform transformation steps directly on S3. Store queries in AWS Glue Data Catalog and share saved queries with other users through Amazon Athena's query editor</strong> - Athena enables running ad hoc SQL queries directly on S3-stored data and is suitable for technical users. However, it requires SQL skills, lacks a visual transformation interface, and does not provide built-in data profiling or visual lineage. While users can save and share queries, Athena is better suited for exploration and reporting than for building shareable, no-code transformation pipelines.</p>\n\n<p><strong>Use AWS Glue Studio’s visual canvas to design data transformation workflows on top of the Parquet files in Amazon S3. Configure Glue Studio jobs to run these transformations without writing code. Share the job definitions with team members for reuse. Use the visual job editor to track transformation progress and inspect profiling statistics for each dataset column</strong> - While AWS Glue Studio does offer a low-code visual interface for building ETL workflows, it is still primarily intended for developers and data engineers. The canvas generates and manages Apache Spark scripts, which may require customization and still involve code for advanced logic. More importantly, Glue Studio does not natively provide built-in data profiling or column-level statistics, unlike AWS Glue DataBrew. Additionally, Glue Studio is less suited for collaboration among non-technical users, and lacks the ability to share visual \"recipes\" with reusable, human-readable steps like DataBrew offers.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/databrew/latest/dg/what-is.html\">https://docs.aws.amazon.com/databrew/latest/dg/what-is.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/blogs/big-data/use-aws-glue-databrew-recipes-in-your-aws-glue-studio-visual-etl-jobs/\">https://aws.amazon.com/blogs/big-data/use-aws-glue-databrew-recipes-in-your-aws-glue-studio-visual-etl-jobs/</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/appflow/latest/userguide/what-is-appflow.html\">https://docs.aws.amazon.com/appflow/latest/userguide/what-is-appflow.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/athena/latest/ug/querying.html\">https://docs.aws.amazon.com/athena/latest/ug/querying.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/emr/latest/EMR-Serverless-UserGuide/emr-serverless.html\">https://docs.aws.amazon.com/emr/latest/EMR-Serverless-UserGuide/emr-serverless.html</a></p>\n"

    "question": "<p>A software company operates a customer analytics platform on a fleet of Amazon EC2 instances. During a quarterly cloud cost review, the finance team discovers an unexpected increase in AWS charges that had gone unnoticed for several days. The company wants to continuously identify abnormal spending patterns and automatically notify designated stakeholders when AWS detects unexpected cost increases.</p>\n\n<p>Which solution will meet these requirements?</p>",
    "options": [],
    "correctAnswerIndices": [],
    "explanation": "<p>Correct option:</p>\n\n<p><strong>Create an AWS Cost Anomaly Detection monitor and configure an alert subscription to notify designated stakeholders when the monitor detects anomalous spending</strong></p>\n\n<p>AWS Cost Anomaly Detection is specifically designed to identify unusual AWS spending patterns. The service uses machine learning models to evaluate historical spending behavior and identify anomalous costs while accounting for factors such as normal growth and recurring spending patterns. This capability directly addresses the requirement to detect spending that deviates unexpectedly from normal usage.</p>\n\n<p>A cost monitor defines the AWS spending that Cost Anomaly Detection evaluates. The company can create an alert subscription for the monitor and specify the stakeholders who should receive notifications. AWS supports email notifications for daily or weekly summaries and Amazon SNS for individual alerts, allowing responsible teams to learn about significant anomalies soon after AWS identifies them.</p>\n\n<p>Unlike a fixed budget or billing alarm, Cost Anomaly Detection does not require the company to predict the exact monetary value at which unusual spending will occur. AWS determines whether spending behavior is anomalous based on learned cost patterns, and the company can configure notification thresholds based on the financial impact or percentage impact of an anomaly. Therefore, Cost Anomaly Detection provides the most appropriate combination of continuous anomaly identification and stakeholder notification.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q8-i3.jpg\" style=\"display: none;\"><span class=\"ud-component--base-components--open-full-size-image\"><div class=\"open-full-size-image--wrapper--R4gIm\" data-purpose=\"open-full-size-image\"><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt1-q8-i3.jpg\" alt=\"\" loading=\"eager\"><button type=\"button\" class=\"ud-btn ud-btn-medium ud-btn-link ud-btn-text-sm open-full-size-image--backdrop--Zor3j\"><svg aria-label=\"Larger image\" role=\"img\" focusable=\"false\" class=\"ud-icon ud-icon-large ud-icon-color-neutral\"><use xlink:href=\"#icon-search\"></use></svg></button></div></span>\nvia - <a href=\"https://aws.amazon.com/blogs/aws-cloud-financial-management/new-aws-cost-explorer-users-can-now-automatically-detect-cost-anomalies/\">https://aws.amazon.com/blogs/aws-cloud-financial-management/new-aws-cost-explorer-users-can-now-automatically-detect-cost-anomalies/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use AWS Pricing Calculator to model the expected cost of the existing EC2 workload and periodically compare the estimate with actual AWS charges</strong> - AWS Pricing Calculator allows architects to estimate the expected cost of AWS architectures before or during deployment. The company could model its EC2 configuration and compare the estimate with actual spending to gain a general understanding of whether its costs align with expectations.</p>\n\n<p>However, AWS Pricing Calculator does not continuously monitor actual account spending or automatically detect anomalous cost patterns. It also does not generate alerts when AWS identifies unexpected changes in real consumption, so this approach would require ongoing manual comparison and would not satisfy the monitoring and notification requirements.</p>\n\n<p><strong>Enable Amazon CloudWatch billing metrics, create alarms for predetermined estimated charge thresholds, and configure Amazon SNS notifications for the finance team</strong> - Amazon CloudWatch can receive AWS billing metrics such as estimated charges, and the company can create alarms that publish notifications through Amazon SNS when those charges exceed specified thresholds. This configuration can help an organization track whether total estimated spending crosses a known monetary limit.</p>\n\n<p>The issue with this approach is that CloudWatch billing alarms use static thresholds rather than anomaly detection based on historical spending behavior. A cost increase could be unusual for the company's normal usage pattern without crossing the configured CloudWatch threshold, while normal growth could cross the threshold without representing an anomaly. AWS Cost Anomaly Detection is purpose-built for the requirement.</p>\n\n<p><strong>Create a zero spend budget from an AWS Budgets template and configure the budget to notify stakeholders when spending exceeds the configured threshold</strong> - AWS Budgets provides templates that simplify creating budgets and associated notifications. A zero spend budget specifically alerts an organization when spending exceeds AWS Free Tier limits, making it useful for accounts in which the organization expects no billable usage.</p>\n\n<p>This company already operates production workloads on Amazon EC2 and therefore expects ongoing AWS charges. A zero spend budget does not distinguish expected spending from anomalous spending and would generate alerts simply because costs exist. It does not satisfy the requirement to identify spending that deviates unexpectedly from established patterns.</p>\n\n<p>References:\n<a href=\"https://docs.aws.amazon.com/cost-management/latest/userguide/manage-ad.html\">https://docs.aws.amazon.com/cost-management/latest/userguide/manage-ad.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/cost-management/latest/userguide/getting-started-ad.html\">https://docs.aws.amazon.com/cost-management/latest/userguide/getting-started-ad.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/cost-management/latest/userguide/budget-templates.html\">https://docs.aws.amazon.com/cost-management/latest/userguide/budget-templates.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/monitor_estimated_charges_with_cloudwatch.html\">https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/monitor_estimated_charges_with_cloudwatch.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/blogs/aws-cloud-financial-management/new-aws-cost-explorer-users-can-now-automatically-detect-cost-anomalies/\">https://aws.amazon.com/blogs/aws-cloud-financial-management/new-aws-cost-explorer-users-can-now-automatically-detect-cost-anomalies/</a></p>\n"
  },
